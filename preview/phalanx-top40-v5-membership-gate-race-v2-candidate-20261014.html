<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NEXUS PHALANX · Top 40 v5</title><style>
*{box-sizing:border-box}body{margin:0;padding:13px;background:#e9dcc1;color:#35291c;font:14px/1.4 system-ui}main{max-width:960px;margin:auto}h1,h2{font-family:Georgia,serif}h1{font-size:25px;margin:0 0 3px}.sub{color:#735b3b;font-size:12px;margin:0 0 12px}.panel{background:linear-gradient(130deg,#fff9e9,#f3e5c9);border:1px solid #c7a56a;border-radius:12px;padding:12px;min-width:0}#phalanxLiveAlliancePanel>h2{margin:0 0 4px;font-size:19px}#phalanxLiveStatus{font-size:11px;color:#765d3d}.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.phalanx-verified-card{border-top:4px solid var(--alliance-accent);padding:10px}.phalanx-verified-card h2{font-size:22px;margin:3px 0 7px}.phalanx-verified-kicker,.phalanx-verified-label{font-size:9px;letter-spacing:.5px;color:#745b3d;font-weight:700}.phalanx-verified-power{display:block;font:700 clamp(11px,3.1vw,19px) Georgia,serif;overflow-wrap:anywhere;margin:3px 0}.phalanx-verified-card p{font-size:11px;font-weight:700;margin:5px 0}.phalanx-verified-card small{font-size:10px}button,select{padding:9px;border-radius:8px;border:1px solid #b8955e;background:#fae9c5;color:#332619}button:disabled{opacity:.5}.scroll{overflow:auto;max-height:55vh;margin-top:8px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid #d7c39e;padding:7px;white-space:nowrap}#phalanxLiveTop40[hidden],#phalanxLiveAlliancePanel[hidden]{display:none}footer{margin-top:14px;font-size:11px;color:#765d3d}@media(min-width:780px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:350px){.grid4{grid-template-columns:1fr}}
table{table-layout:fixed;width:100%}th:first-child,td:first-child{width:14%;text-align:center}th:nth-child(2),td:nth-child(2){width:46%;overflow-wrap:anywhere;white-space:normal}th:last-child,td:last-child{width:40%;text-align:right;font-variant-numeric:tabular-nums}thead{position:sticky;top:0;background:#fff5df;z-index:1}tbody tr:nth-child(even){background:#e8d9bb55}tbody tr:nth-child(-n+3){font-weight:700}#phalanxLiveTop40{max-height:48vh;overscroll-behavior:contain;border:1px solid #d4bb8d;border-radius:9px}#phalanxLiveTop40Status{font-size:12px;font-weight:600;color:#4c6d4a;min-height:18px} @media(max-width:430px){th,td{padding:8px 4px;font-size:11px}} </style></head><body><main><h1>NEXUS PHALANX</h1><p class="sub">KINGDOM #1885 · Aktueller Allianzvergleich · 13.10.2026</p><section id="phalanxLiveAlliancePanel" class="panel"><h2>🔒 Allianzvergleich · Live-Daten</h2><small id="phalanxLiveStatus">Prüfe bestehende NEXUS-Anmeldung …</small><div id="phalanxLiveCards" class="grid4"></div><label for="phalanxLiveAllianceSelect">Top 40: </label><select id="phalanxLiveAllianceSelect"><option>NXS</option><option>FRA</option><option>OoO</option><option>MYM</option></select> <button id="phalanxLiveTop40Button" type="button">Top 40 anzeigen</button><p id="phalanxLiveTop40Status" role="status" aria-live="polite" style="font-size:12px;overflow-wrap:anywhere">Button bereit · Testversion 5</p><div id="phalanxLiveTop40" class="scroll" hidden></div></section><footer>Isolierte private Testansicht. Keine historischen Zahlen vom 02.10.2026. Live-App unverändert.</footer></main><script type="module">
{
 const panel=document.getElementById('phalanxLiveAlliancePanel'),cards=document.getElementById('phalanxLiveCards'),status=document.getElementById('phalanxLiveStatus'),topButton=document.getElementById('phalanxLiveTop40Button'),topBox=document.getElementById('phalanxLiveTop40'),topStatus=document.getElementById('phalanxLiveTop40Status');
 panel.hidden=false;
 const allianceSelect=document.getElementById('phalanxLiveAllianceSelect');
 const colors={NXS:'#417750',FRA:'#a14b3d',OoO:'#b25a91',MYM:'#86649b'};
 let client, accessReady=false, accessEpoch=0, authorizedUserId=null;
 topButton.disabled=true;
 const revokeAccess=()=>{accessReady=false;authorizedUserId=null;accessEpoch++;topButton.disabled=true;topBox.hidden=true;topBox.replaceChildren();topStatus.textContent='Zugriff nicht freigegeben';};
 // Bind the button before any asynchronous authentication or data fetch.
 topButton.addEventListener('click',async()=>{
   topStatus.textContent='Klick erkannt · prüfe '+allianceSelect.value+' …';
   if(!client||!accessReady){topStatus.textContent='Klick erkannt · Zugriff noch nicht freigegeben';return;}
   const requestEpoch=accessEpoch;
   topButton.disabled=true;
   try{
     const chosen=allianceSelect.value;
     const {data,error}=await client.from('phalanx_alliance_top40')
       .select('alliance,position,player_name,power,snapshot_date')
       .eq('kingdom',1885).eq('alliance',chosen)
       .eq('snapshot_date','2026-10-13').order('position');
     if(!accessReady||requestEpoch!==accessEpoch)return;
     if(error)throw Error('DB '+(error.code||'ERROR')+': '+String(error.message||'').slice(0,120));
     if(data?.length!==40)throw Error('Erhalten: '+(data?.length??0)+' statt 40 Einträge');
     const table=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');
     for(const name of ['Rang','Spieler','Power']){const th=document.createElement('th');th.textContent=name;tr.append(th)}
     thead.append(tr);table.append(thead);const tbody=document.createElement('tbody');
     for(const p of data){const row=document.createElement('tr');for(const value of [p.position,p.player_name??'—',Number(p.power).toLocaleString('en-US')]){const td=document.createElement('td');td.textContent=value;row.append(td)}tbody.append(row)}
     table.append(tbody);topBox.replaceChildren(table);topBox.hidden=false;topStatus.textContent='40 Einträge geladen · '+chosen;
   }catch(e){if(accessReady&&requestEpoch===accessEpoch){topStatus.textContent='Klick erkannt · FEHLER: '+String(e?.message||e).slice(0,160);topBox.hidden=true;}}
   finally{topButton.disabled=!accessReady;}
 });
 allianceSelect.addEventListener('change',()=>{topBox.hidden=true;topBox.replaceChildren();topStatus.textContent='Allianz '+allianceSelect.value+' gewählt · bereit';});
 const fmt=x=>Number(x).toLocaleString('en-US');
 async function initializeTop40Access(){
 try{
  const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
  client=createClient('https://hcjrdofkdkasznywvcxo.supabase.co','sb_publishable_hkqBaMme70g2f3wcxvaTKg_FczqkpCh',{auth:{persistSession:true,autoRefreshToken:true}});
  const initEpoch=accessEpoch;
  client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||event==='USER_DELETED'||(event==='SIGNED_IN'&&authorizedUserId&&session?.user?.id!==authorizedUserId))revokeAccess();});
  const identity=await client.auth.getUser();
  if(initEpoch!==accessEpoch)return;
  if(identity.error||!identity.data?.user)throw Error('NOT_SIGNED_IN');
  const verifiedUserId=identity.data.user.id;
  const {data:memberships,error:membershipError}=await client.from('nxs_memberships').select('active,expires_at').eq('user_id',identity.data.user.id).eq('active',true);
  if(initEpoch!==accessEpoch)return;
  if(membershipError||!(memberships||[]).some(m=>m.active===true&&(!m.expires_at||(Number.isFinite(Date.parse(m.expires_at))&&Date.parse(m.expires_at)>Date.now()))))throw Error('MEMBERSHIP_DENIED');
  const {data,error}=await client.from('phalanx_alliance_latest').select('alliance,members,total_power,tg5,tg4,snapshot_date').eq('kingdom',1885);
  if(initEpoch!==accessEpoch)return;
  if(error)throw Error('ACCESS_DENIED');
  const names=['NXS','FRA','OoO','MYM'];
  if(data?.length!==4||names.some(n=>!data.some(d=>d.alliance===n&&d.snapshot_date==='2026-10-13')))throw Error('INCOMPLETE_SNAPSHOT');
  for(const name of names){
   const d=data.find(x=>x.alliance===name),card=document.createElement('article');
   card.className='panel phalanx-verified-card';card.dataset.alliance=name;card.style.setProperty('--alliance-accent',colors[name]);
   const title=document.createElement('h2');title.textContent=name;title.style.color=colors[name];
   const detail=document.createElement('p');detail.textContent=fmt(d.total_power)+' power · '+fmt(d.members)+' members';
   const levels=document.createElement('small');levels.textContent='TG5: '+fmt(d.tg5)+' · TG4: '+fmt(d.tg4);
   const kicker=document.createElement('small');kicker.className='phalanx-verified-kicker';kicker.textContent='KINGDOM #1885 · VERIFIED';
   const powerLabel=document.createElement('div');powerLabel.className='phalanx-verified-label';powerLabel.textContent='TOTAL POWER';
   const powerValue=document.createElement('strong');powerValue.className='phalanx-verified-power';powerValue.textContent=fmt(d.total_power);
   detail.textContent=fmt(d.members)+' MEMBERS';
   card.append(kicker,title,powerLabel,powerValue,detail,levels);cards.append(card);
  }
  if(initEpoch!==accessEpoch)return;
  authorizedUserId=verifiedUserId;accessReady=true;topButton.disabled=false;
  status.textContent='LIVE READ_OK · verified snapshot 2026-10-13 · private member access';
  topStatus.textContent='Button bereit · angemeldet';
 }catch(e){if(initEpoch!==accessEpoch)return;revokeAccess();status.textContent='Live data unavailable: '+(e.message==='NOT_SIGNED_IN'?'not signed in':e.message==='ACCESS_DENIED'||e.message==='MEMBERSHIP_DENIED'?'member access denied':'snapshot incomplete or connection error');}
 }
 initializeTop40Access();

}
</script></body></html>
