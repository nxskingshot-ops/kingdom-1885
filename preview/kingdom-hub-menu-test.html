const mapButton=document.getElementById('mapButton'),kvkButton=document.getElementById('kvkButton'),scoutButton=document.getElementById('scoutButton'),liveScoutButton=document.getElementById('liveScoutButton');
const map=document.getElementById('map'),kvk=document.getElementById('kvk'),scouting=document.getElementById('scouting'),liveScouting=document.getElementById('liveScouting');
let kvkLoaded=false,scoutLoaded=false,liveScoutLoaded=false;
function activate(section){
 if(!['map','kvk','scouting','liveScouting'].includes(section))section='map';
 if(section!=='map')document.body.classList.remove('map-focus');
 document.body.classList.toggle('kvk',section==='kvk');

const dismissKeyboard=document.getElementById('dismissKeyboard');
function isTypingElement(el){
 if(!el||!el.matches)return false;
 if(el.matches('textarea,[contenteditable=""],[contenteditable="true"]'))return true;
 return el.matches('input:not([type="button"]):not([type="submit"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]):not([type="range"]):not([type="color"]):not([type="reset"])');
}
function focusedInput(){
 for(const frame of [map,kvk,scouting,liveScouting]){
  try{const el=frame.contentDocument?.activeElement;if(el&&isTypingElement(el))return el;}
  catch(e){/* Third-party content cannot be read; no control applied. */}
 }
 return isTypingElement(document.activeElement)?document.activeElement:null;
}
function updateKeyboardButton(){dismissKeyboard.hidden=!focusedInput();}
function connectKeyboardSupport(frame){
 try{
  const doc=frame.contentDocument;
  if(!doc)return;
  doc.addEventListener('focusin',updateKeyboardButton);
  doc.addEventListener('focusout',()=>setTimeout(updateKeyboardButton,90));
  doc.addEventListener('visibilitychange',updateKeyboardButton);
 }catch(e){/* Not all iframe documents permit shared input management. */}
}
[map,kvk,scouting,liveScouting].forEach(frame=>{
 frame.addEventListener('load',()=>{connectKeyboardSupport(frame);updateKeyboardButton();});
 connectKeyboardSupport(frame);
});

};

 });
