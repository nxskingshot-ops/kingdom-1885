<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kingdom #1885 · Outpost Viewer for An</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#140e0a}
iframe{border:0;width:100%;height:100%;display:block}
#loading{position:fixed;z-index:2147483647;top:9px;right:9px;padding:7px 11px;background:#281c13ee;color:#ffe8bc;border:1px solid #d4a458;border-radius:8px;font:12px system-ui}
#loading[hidden]{display:none}
</style></head><body>
<div id="loading" role="status">Loading Kingdom #1885…</div>
<iframe id="kingdom" src="../index.html?kingdom-preview=an-viewer-v1&single-header=3" title="Kingdom #1885 Outpost Map" allow="fullscreen"></iframe>
<script>
const frame=document.getElementById('kingdom'),status=document.getElementById('loading');
frame.addEventListener('load',()=>{try{
const doc=frame.contentDocument;if(!doc||!doc.body)throw Error('map unavailable');
const script=doc.createElement('script');
script.src=new URL('./outpost-viewer-an-v1.js?build=outpost-intelligence-v25',location.href).href;
// Hide an extra NEXUS shell, if the embedded map contains one.
const nestedStyle=doc.createElement('style');
nestedStyle.textContent='.shared{display:none!important}body:has(>.shared) #bar{display:none!important}body:has(>.shared)>iframe{height:100%!important;flex:1 1 auto!important}/* NEXUS test: no second title strip; compact controls float over the map. */#app{grid-template-rows:0 minmax(0,1fr) 42px!important;--toolbar-h:0px!important}#app>.top{display:none!important}#mapTools{position:absolute!important;left:auto!important;right:6px!important;top:6px!important;width:auto!important;height:auto!important;min-height:0!important;padding:0!important;gap:4px!important;background:transparent!important;border:0!important;box-shadow:none!important}#mapTools .mapbrand,#mapTools #healthBadge{display:none!important}#mapTools button{min-height:27px!important;padding:4px 6px!important}';
doc.head.appendChild(nestedStyle);
// The map's own fullscreen icon must not fullscreen ONLY the nested iframe:
// that would hide the NEXUS header/menu. Forward the same user tap to the
// top-level NEXUS shell, while leaving all map tools and map data untouched.
doc.addEventListener('click',event=>{
 const control=event.target?.closest?.('button,[role="button"]');
 if(!control)return;
 const label=[control.id,control.getAttribute('aria-label'),control.getAttribute('title'),control.getAttribute('data-action'),control.textContent].filter(Boolean).join(' ');
 if(!/full[\s-]?screen|vollbild|⛶|⤢/i.test(label))return;
 try{
  const root=window.top;
  if(!root?.document?.getElementById('nexusMenuButton'))return;
  event.preventDefault();event.stopImmediatePropagation();
  if(root.document.fullscreenElement)root.document.exitFullscreen();
  else{
   if(root.document.body.classList.contains('map-focus'))root.setMapFocus?.(false);
   root.document.documentElement.requestFullscreen?.().catch(err=>console.warn('NEXUS full screen unavailable',err));
  }
 }catch(err){console.warn('NEXUS map fullscreen routing unavailable',err)}
},true);
// The underlying Kingdom map defaults to Fit map (fixed aspect ratio),
// leaving wide empty margins in NEXUS landscape. Select its native Cover mode
// after the map's own event handlers are initialized; do not stretch its image.
let initialFillDone=false;
function selectNativeCover(){
  if(initialFillDone)return true;
  const mapDoc=frame.contentDocument;
  const app=mapDoc?.getElementById('app');
  const cover=mapDoc?.getElementById('coverMode');
  if(!app||!cover||frame.getBoundingClientRect().width<120)return false;
  if(!app.classList.contains('cover-map'))cover.click();
  // Fall back to the native mode's state if an earlier handler was unavailable.
  if(!app.classList.contains('cover-map'))return false;
  initialFillDone=true;
  return true;
}
function fillOnStartup(){
  if(selectNativeCover())return;
  setTimeout(()=>{if(!selectNativeCover())setTimeout(selectNativeCover,800)},350);
}
// Wait until the nested map has fully loaded before choosing its display mode.
function enforceSingleHeader(){
 const root=frame.contentDocument;
 const app=root?.getElementById('app');
 const top=app?.querySelector(':scope > .top');
 const tools=app?.querySelector('#mapTools');
 if(!app||!tools)return;
 app.style.setProperty('grid-template-rows','0px minmax(0,1fr) 42px','important');
 app.style.setProperty('--toolbar-h','0px','important');
 if(top)top.style.setProperty('display','none','important');
 const brand=tools.querySelector('.mapbrand');
 if(brand)brand.style.setProperty('display','none','important');
 const badge=tools.querySelector('#healthBadge');
 if(badge)badge.style.setProperty('display','none','important');
 for(const [key,val] of Object.entries({position:'absolute',left:'auto',right:'6px',top:'6px',width:'auto',height:'auto',background:'transparent',border:'0',boxShadow:'none'}))tools.style.setProperty(key.replace(/[A-Z]/g,m=>'-'+m.toLowerCase()),val,'important');
}
function wireNativeBottomBar(){
 const d=frame.contentDocument;if(!d)return;
 const app=d.getElementById('app');
 if(!app)return;
 // Restore the map's own bottom row explicitly; this is the navigation source.
 app.style.setProperty('grid-template-rows','0px minmax(0,1fr) 42px','important');
 const candidates=[...d.querySelectorAll('nav,footer,[role="navigation"],[role="tablist"],.bottom,.bottom-nav,.bottomNav,#bottomNav,#bottomBar,#tabs,.tabs,.tabbar')];
 const bar=candidates.find(el=>{const t=(el.textContent||'').replace(/\\s+/g,' ');return /Map/i.test(t)&&/List/i.test(t)&&/Statistics/i.test(t)&&/Settings/i.test(t);});
 if(!bar)return;
 bar.style.setProperty('display','grid','important');
 bar.style.setProperty('visibility','visible','important');
 bar.style.setProperty('opacity','1','important');
 if(!d.getElementById('nexusNativeIntelTab')){
  const settings=[...bar.querySelectorAll('button,[role="button"],[role="tab"]')].find(el=>/Settings/i.test(el.textContent||''));
  if(settings){
   const intel=settings.cloneNode(true);intel.id='nexusNativeIntelTab';intel.removeAttribute('aria-current');intel.removeAttribute('aria-pressed');
   const walker=d.createTreeWalker(intel,NodeFilter.SHOW_TEXT);let n,changed=false;while(n=walker.nextNode()){if(/Settings/i.test(n.nodeValue)){n.nodeValue=n.nodeValue.replace(/Settings/i,'Intelligence');changed=true;}}
   if(!changed)intel.textContent='⌕ Intelligence';
   bar.insertBefore(intel,settings);
   intel.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();d.getElementById('outpostIntelButton')?.click();});
  }
 }
 const floating=d.getElementById('outpostIntelButton');if(floating)floating.style.setProperty('display','none','important');
}
script.onload=()=>{status.hidden=true;enforceSingleHeader();wireNativeBottomBar();requestAnimationFrame(()=>{enforceSingleHeader();wireNativeBottomBar();fillOnStartup()});setTimeout(()=>{enforceSingleHeader();wireNativeBottomBar();selectNativeCover()},350);setTimeout(wireNativeBottomBar,1200)};
script.onerror=()=>{status.textContent='Live controls unavailable · reload to retry'};
doc.body.appendChild(script);
setTimeout(()=>{if(!status.hidden&&status.textContent==='Loading Kingdom #1885…')status.textContent='Still loading map…';},12000)
}catch(e){status.textContent='Map setup error · reload to retry'}});
</script></body></html>
