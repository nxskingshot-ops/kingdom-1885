<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PHALANX FIRST STRIKE · Territory Integration Alpha</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#061018;color:#f0dcaa;font:14px system-ui,sans-serif}
.shell{height:100dvh;display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #80683a;background:#081724;min-height:50px}
.bar strong{flex:1;font:600 14px system-ui,sans-serif}.bar button{background:#172732;border:1px solid #9c8145;color:#f4dda3;padding:9px 13px;border-radius:7px;cursor:pointer;min-height:40px}
.bar button[hidden]{display:none}.stage{flex:1;min-height:0}.stage iframe{width:100%;height:100%;border:0;display:block}
.note{font:11px/1.4 system-ui,sans-serif;color:#cbbf9f}.error{color:#ffd19a}
@media(max-width:390px){.bar{padding:6px}.bar strong{font-size:12px}.bar button{padding:7px}}
</style></head><body>
<div class="shell"><nav class="bar" aria-label="Isolierte PHALANX-Navigation">
<button id="back" type="button" hidden>← Zurück</button>
<strong id="heading">Territory Control</strong><span id="status" class="note">RC5 wird geladen</span>
</nav><main class="stage"><iframe id="screen" title="Territory Control · RC5 mit OUT-024 und Reports" src="about:blank"></iframe></main></div>
<script>
(()=>{'use strict';
const frame=document.getElementById('screen'),back=document.getElementById('back'),heading=document.getElementById('heading'),status=document.getElementById('status');
const routes=Object.freeze({territory:'./PHALANX_RC5_OUT024_REPORTS_ISOLATED_NAV_20261019.html'});
let active='territory';
function navigate(route){if(!Object.hasOwn(routes,route)){status.textContent='Unbekannte Route';status.classList.add('error');return}
active=route;heading.textContent='Territory Control';back.hidden=true;status.textContent='RC5 · Outpost Map · Reports';frame.src=routes[route]}
function backToTerritory(){navigate('territory')}
back.addEventListener('click',backToTerritory);
frame.addEventListener('load',()=>{try{const pathname=frame.contentWindow.location.pathname;if(pathname.endsWith('/'+routes.territory.slice(2)))status.textContent='Territory Control bereit'}catch(_){status.textContent='Isolierte Ansicht geladen'}});
navigate('territory');
})();
</script></body></html>
