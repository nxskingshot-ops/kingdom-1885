<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NEXUS PHALANX – Passwort wiederherstellen</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0c1420;color:#e6d8b5;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:min(100%,430px);padding:24px;border:1px solid #826c41;border-radius:12px;background:#111b29}
h1{font-size:1.4rem;color:#dfb766;letter-spacing:.04em;margin:0 0 18px}
#status{line-height:1.55;min-height:2.5em}
label{display:block;margin:18px 0 6px}
input{width:100%;min-height:44px;border:1px solid #8d7a59;border-radius:6px;background:#0c1420;color:#fff;padding:10px;font:inherit}
button{min-height:44px;border:1px solid #a58b58;border-radius:6px;background:#332a1e;color:#f0d7a2;padding:9px 14px;font:inherit;cursor:pointer}
button[type=submit]{margin-top:22px;width:100%}
button:focus-visible,input:focus-visible{outline:2px solid #f2cc75;outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Passwort wiederherstellen</h1>
<p id="status" role="status" aria-live="polite">Wiederherstellungslink wird geprüft …</p>
<form id="reset" hidden>
<label for="password">Neues Passwort</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" required>
<button type="submit">Passwort ändern</button>
</form>
</main>
<script type="module" src="./password-recovery.js"></script>
</body>
</html>
