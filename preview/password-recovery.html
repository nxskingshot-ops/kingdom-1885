<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>PHALANX – Passwort wiederherstellen</title><style>
:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071725;color:#f4dda0;font:16px system-ui,sans-serif;padding:20px;box-sizing:border-box}main{width:min(100%,430px);border:1px solid #bd9447;border-radius:20px;padding:26px;background:#0b2132;box-sizing:border-box}h1{font-family:Georgia,serif;font-size:28px}label{display:block;margin:20px 0 8px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #b99a65;border-radius:8px;font-size:17px}button{background:#d9b873;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.password-wrap{display:flex;gap:8px;align-items:center}.password-wrap input{flex:1;min-width:0}.password-wrap button{flex:none;padding:12px}.hint{font-size:13px;margin-top:7px}.hint.error{color:#ffb7a8}p{line-height:1.5}a{color:#f4dda0}</style></head><body><main><h1>⚔ PHALANX</h1><h2>Neues Passwort</h2><p>Dieser Bereich ist ausschließlich für die Passwortwiederherstellung. Hier werden keine Outpost-Daten geladen.</p><form id="reset"><label for="password">Neues Passwort (mindestens 12 Zeichen)</label><div class="password-wrap"><input id="password" type="password" autocomplete="new-password" minlength="12" required><button type="button" id="togglePassword" aria-controls="password confirmPassword" aria-pressed="false">Anzeigen</button></div><label for="confirmPassword">Passwort bestätigen</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required><p id="matchMessage" class="hint" role="status">Bitte beide Felder ausfüllen.</p><p><button id="submitPassword" type="submit" disabled>Passwort ändern</button></p></form><p id="status" role="status">Wiederherstellungslink wird geprüft …</p><p><a href="./outpost-editor.html">Zur Anmeldung</a></p></main><script type="module" src="./password-recovery.js"></script></body></html>
