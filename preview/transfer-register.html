<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHALANX · Create account</title><style>

</style></head><body><main><header class="phx-brand"><div class="phx-art" role="img" aria-label="PHALANX Spartan helmet and red-blue banners"></div><div class="phx-title">PHALANX · REGISTER</div></header><section class="phx-card"><h1>Create account</h1><div class="phx-actions"><a class="phx-back" href="./transfer-scouting-id-stage-20261030.html">← Sign in</a></div><form id="register"><label>Email address<input id="email" type="email" autocomplete="email" required></label><label>Kingshot Player ID<input id="playerId" name="playerId" type="text" inputmode="numeric" pattern="[0-9]+" maxlength="20" autocomplete="off" required aria-describedby="playerHelp"></label><small id="playerHelp">Your numeric Kingshot Player ID. This is not an administrator credential.</small><label>Password<input id="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input id="confirm" type="password" autocomplete="new-password" minlength="12" required></label><label><input id="show" type="checkbox" style="display:inline;width:auto"> Show passwords</label><button>Create account</button></form><p id="status" role="status" aria-live="polite"></p><p class="phx-note">Account registration does not grant access. Your module role requires approval.</p><p><a href="./password-recovery.html">Forgot password?</a></p></section></main><script type="module" src="./transfer-register.js"></script></body></html>
