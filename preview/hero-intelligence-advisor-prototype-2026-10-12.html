<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS PHALANX · Hero Intelligence Prototype</title><style>body{background:#101c2b;color:#f3e5c5;font:16px system-ui;margin:0;padding:22px;max-width:760px}h1{color:#e8c16e}section{background:#1c2b3c;padding:18px;border:1px solid #8c713f;border-radius:14px;margin:16px 0}label{display:block;margin:12px 0}select,input,button{font:inherit;padding:9px;border-radius:8px;max-width:100%}button{background:#d9b66c;color:#132032;border:0;cursor:pointer}small{color:#c4c5c8}#result{line-height:1.6}</style><h1>⚔️ Hero Intelligence</h1><p>Standalone functional prototype · No changes to frozen Command Center</p><section><label>Hero comparison <select id="pair"><option value="inf">Amadeus → Alcar → Long Fei (Infantry)</option><option value="arch">Marlin → Rosa → Vivian (Archer)</option><option value="cav">Petra → Margot → Thrud (Cavalry)</option></select></label><label>Current hero stars <select id="stars"><option value="5">5★ maxed</option><option value="4">4★</option><option value="3">3★</option><option value="2">2★</option></select></label><label>Primary use <select id="mode"><option>Bear Trap</option><option>Rally Lead</option><option>Rally Joiner</option><option>PvP</option><option>Garrison</option><option>Arena</option></select></label><label>Resource strategy <select id="budget"><option>F2P / save resources</option><option>Flexible investment</option></select></label><button id="run">Compare heroes</button></section><section id="result" aria-live="polite"></section><small>Advisory logic only. No verified numerical skill or damage claims; results are conditional, not battle guarantees. All Gen 5 assumptions require source validation before production.</small><script>const heroes={inf:['Amadeus','Alcar','Long Fei'],arch:['Marlin','Rosa','Vivian'],cav:['Petra','Margot','Thrud']};function compare(){const pair=document.getElementById('pair').value,stars=+document.getElementById('stars').value,mode=document.getElementById('mode').value,budget=document.getElementById('budget').value,h=heroes[pair],maxed=stars===5;let recommendation=maxed?'Keep your fully developed '+h[0]+' as the baseline. Do not replace solely because a newer generation is available.':'Compare current skill levels and accessible shards before changing your main march.';if(pair==='inf'&&['Garrison','PvP'].includes(mode))recommend+=' '+h[1]+' may provide a defensive alternative; compare actual skill levels.';if(pair==='arch'&&mode==='Bear Trap')recommend+=' Verify rally-specific damage skills before replacing '+h[0]+'.';if(pair==='cav'&&mode==='Rally Lead')recommend+=' Check offensive rally buffs rather than generation alone.';if(budget.startsWith('F2P'))recommend+=' Preserve gems and shards for a meaningful, verified improvement.';document.getElementById('result').textContent=h.join(' vs ')+' | '+mode+' | '+stars+'★. '+recommend+' Generation 5 ('+h[2]+') is an option to reassess when actual acquisition cost and skills are confirmed.'}document.getElementById('run').addEventListener('click',compare);compare()</script></html>
