<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHALANX · MightPulse Refresh Test</title><style>body{margin:0;background:radial-gradient(ellipse at top,#243751,#0c1324 75%);color:#f4e9cf;font:16px system-ui;padding:20px}main{max-width:470px;margin:30px auto;border:1px solid #967b45;border-radius:20px;padding:22px;background:#121d31;box-shadow:0 0 28px #c5a85c22}h1{font-size:23px;color:#e7c97e}p{line-height:1.5;color:#d5d6dc}input,button{box-sizing:border-box;width:100%;border-radius:10px;padding:13px;margin:6px 0;font:inherit}input{background:#0b1425;color:white;border:1px solid #6c7390}button{border:1px solid #d1aa5b;background:#6e552b;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.phalanx-mightpulse-refresh{border-top:1px solid #78633c;margin-top:18px;padding-top:18px}small{color:#aeb8c8}</style></head><body><main><h1>🛡️ NEXUS PHALANX</h1><p>MightPulse · Manueller Refresh · isolierter Funktionstest</p><small>Produktive App und eingefrorenes Alpha35 bleiben unverändert.</small><div id="auth"><p>Mit deinem PHALANX/Supabase-Testkonto anmelden:</p><form id="login"><input id="email" type="email" autocomplete="username" placeholder="E-Mail" required><input id="password" type="password" autocomplete="current-password" placeholder="Passwort" required><button type="submit">Anmelden</button></form></div><p id="authstatus" role="status"></p><div id="refresh"></div><button id="logout" hidden>Abmelden</button></main><script type="module">import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";import {mountMightPulseRefresh} from "../staging/phalanx-mightpulse-manual-refresh.js";const supabase=createClient("https://hcjrdofkdkasznywvcxo.supabase.co","sb_publishable_hkqBaMme70g2f3wcxvaTKg_FczqkpCh");const auth=document.getElementById("auth"),status=document.getElementById("authstatus"),refresh=document.getElementById("refresh"),logout=document.getElementById("logout");let unmount=null;async function render(){const {data:{session}}=await supabase.auth.getSession();if(unmount){unmount();unmount=null}auth.hidden=!!session;logout.hidden=!session;if(session){status.textContent="✓ Angemeldet · bereit für manuellen Test";unmount=mountMightPulseRefresh({container:refresh,supabase})}else status.textContent="Bitte anmelden."}document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();status.textContent="Anmeldung läuft …";const {error}=await supabase.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error){status.textContent="Anmeldung fehlgeschlagen: "+error.message;return}document.getElementById("password").value="";await render()});logout.onclick=async()=>{await supabase.auth.signOut();await render()};await render();</script></body></html>
