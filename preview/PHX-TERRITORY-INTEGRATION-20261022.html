<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PHALANX · Territory Control isolated integration</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08131d;color:#f4dfb0;font:16px system-ui}header{padding:18px;border-bottom:2px solid #d6ad57;background:#132333}h1{margin:6px 0;font:700 1.65rem Georgia,serif}main{padding:18px;max-width:1000px;margin:auto}button,a{display:inline-block;margin:6px 6px 6px 0;padding:13px;border:1px solid #d2ac64;border-radius:10px;background:#24364b;color:#ffe6ad;font:inherit;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #fff}section{padding:18px;border:1px solid #987b4e;border-radius:12px;background:#101f2d}iframe{width:100%;height:75vh;min-height:420px;border:1px solid #987b4e;border-radius:8px}#back,#menu{display:none}body:not([data-view=home]) #back,body:not([data-view=home]) #menu{display:inline-block}body[data-view=territory] header{border-color:#b94e4e}body[data-view=atlas] header,body[data-view=reports] header{border-color:#568ed0}small{color:#c6c9cd}</style></head><body data-view="home"><header><button id="back" type="button">← Zurück</button><button id="menu" type="button">Menü</button><h1 id="title">NEXUS PHALANX</h1><small id="type">HOME · Gold · kein Burger</small></header><main><section id="content"></section></main><script>
const title=document.getElementById('title'),type=document.getElementById('type'),content=document.getElementById('content');
const labels={home:['NEXUS PHALANX','HOME · Gold · kein Burger'],territory:['Territory Control','MODUL · Rot · Zurück und Menü'],atlas:['Outpost Atlas','FUNKTION · Blau · Original OUT-024'],reports:['Outpost Reports','FUNKTION · Blau · Integrationsstatus']};let current='home';
function button(label,next){const b=document.createElement('button');b.textContent=label;b.onclick=()=>show(next);return b}
function show(next){if(!labels[next])return;current=next;document.body.dataset.view=next;title.textContent=labels[next][0];type.textContent=labels[next][1];content.replaceChildren();const h=document.createElement('h2');h.textContent=labels[next][0];content.append(h);
if(next==='home'){content.append(button('Territory Control','territory'));const p=document.createElement('p');p.textContent='Isolierter technischer Einstieg. Das freigegebene HOME-Artwork wird hier nicht ersetzt oder als implementiert ausgegeben.';content.append(p)}
if(next==='territory'){content.append(button('Outpost Map 2.0','atlas'),button('Outpost Reports','reports'))}
if(next==='atlas'){const p=document.createElement('p');p.textContent='Unveränderte, bestätigte OUT-024 Originaldatei. Live-Daten und Geräteverhalten sind noch nicht getestet.';content.append(p);const f=document.createElement('iframe');f.title='OUT-024 Outpost Map 2.0';f.src='./PHX-OUT-024-MAP2-FROZEN-20261018.html';content.append(f)}
if(next==='reports'){const p=document.createElement('p');p.textContent='Reports sind noch nicht integriert. Der ältere Viewer V11 wird absichtlich nicht geladen; es werden keine Daten oder Ergebnisse erfunden.';content.append(p)}
}
document.getElementById('back').onclick=()=>show(current==='territory'?'home':'territory');document.getElementById('menu').onclick=()=>show('home');show('home');
</script></body></html>
