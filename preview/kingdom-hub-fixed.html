<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kingdom #1885 App · Fixed Layout</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#151b16;color:#ffe5b3;font:13px system-ui}#bar{height:48px;background:#322518;border-bottom:2px solid #b28b4a;display:flex;align-items:center;gap:8px;padding:5px 9px}#bar strong{font:700 16px Georgia,serif;margin-right:auto;white-space:nowrap}button{padding:7px 11px;background:#f0cf8f;border:1px solid #ad833f;color:#32200c;border-radius:8px;font-weight:bold;cursor:pointer}button[aria-pressed="true"]{background:#f9e9c6}iframe{width:100%;height:calc(100% - 48px);border:0;display:block}#kvk{display:none}body.kvk #map{display:none}body.kvk #kvk{display:block}@media(max-width:430px){#bar strong{font-size:12px}button{font-size:11px;padding:7px}}html,body{width:100%;max-width:100%;overflow:hidden}#bar{max-width:100%;min-width:0}#bar strong{overflow:hidden;text-overflow:ellipsis}iframe{max-width:100%;min-width:0}</style></head><body>
<nav id="bar" aria-label="Kingdom sections"><strong>♛ Kingdom #1885</strong><button id="mapButton" aria-pressed="true">🗺 Outpost Map</button><button id="kvkButton" aria-pressed="false">⚔ KvK Prep 🔒</button></nav>
<iframe id="map" title="Public Kingdom Outpost Map" src="./for-an.html"></iframe>
<iframe id="kvk" title="Protected KvK Prep Dashboard" loading="lazy"></iframe>
<script>let loaded=false;const map=document.getElementById('mapButton'),kvk=document.getElementById('kvkButton'),view=document.getElementById('kvk');function activate(name){document.body.classList.toggle('kvk',name==='kvk');map.setAttribute('aria-pressed',name==='map'?'true':'false');kvk.setAttribute('aria-pressed',name==='kvk'?'true':'false');if(name==='kvk'&&!loaded){view.src='./kvk-prep-fixed.html';loaded=true;}history.replaceState(null,'',name==='kvk'?'?view=kvk':'?view=map');}map.onclick=()=>activate('map');kvk.onclick=()=>activate('kvk');if(new URLSearchParams(location.search).get('view')==='kvk')activate('kvk');</script></body></html>
