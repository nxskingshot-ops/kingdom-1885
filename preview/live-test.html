<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kingdom #1885 · Live Outpost Test</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#140e0a}iframe{border:0;width:100%;height:100%;display:block}#diag{position:fixed;z-index:2147483647;right:8px;top:8px;max-width:310px;padding:8px 10px;background:#281c13f0;color:#fff4dc;border:2px solid #d4a458;border-radius:9px;font:12px system-ui;box-shadow:0 1px 12px #0006}#diag button{margin-left:10px;background:#e9d29d;border:0;padding:4px 8px;border-radius:5px}</style></head>
<body><div id="diag">Live preview: loading… <button type="button" onclick="this.parentElement.remove()">×</button></div><iframe id="kingdom" src="../index.html" title="Kingdom 1885 Outposts" allow="fullscreen"></iframe>
<script>
const frame=document.getElementById('kingdom'),diag=document.getElementById('diag');
frame.addEventListener('load',()=>{
 try{
  const doc=frame.contentDocument;
  if(!doc||!doc.body){diag.firstChild.textContent='Live preview: cannot access map frame. ';return}
  diag.firstChild.textContent='Live preview: map loaded, loading controls… ';
  frame.contentWindow.addEventListener('error',e=>{diag.firstChild.textContent='Live script error: '+e.message+' ';});
  frame.contentWindow.addEventListener('unhandledrejection',e=>{diag.firstChild.textContent='Live request error: '+String(e.reason?.message||e.reason)+' ';});
  const script=doc.createElement('script');
  const liveScriptUrl=new URL('outpost-live.js',window.location.href);liveScriptUrl.searchParams.set('v','6');script.src=liveScriptUrl.href;
  script.onload=()=>{diag.firstChild.textContent='Live script loaded; check Sync and Officer buttons. ';};
  script.onerror=()=>{diag.firstChild.textContent='Live script could not be downloaded. ';};
  doc.body.appendChild(script);
 }catch(e){diag.firstChild.textContent='Live preview error: '+e.message+' ';}
});
</script></body></html>
