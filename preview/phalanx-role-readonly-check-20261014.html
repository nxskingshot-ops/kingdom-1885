<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHALANX · Membership Role Check</title><style>body{background:#051b2a;color:#f1d177;font:17px system-ui;margin:0;padding:24px;max-width:650px}p{color:#c0d4df}button{padding:13px 18px;background:#e1bc66;border:0;border-radius:9px;font-size:16px}#status{white-space:pre-line;line-height:1.7}</style><h1>PHALANX · Role Verification</h1><p>Read-only HTTPS diagnostic. Checks the current Supabase session and active NXS membership role. No write operations.</p><button id="check" type="button">Verify membership and role</button><p id="status">Not checked</p><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const c=createClient('https://hcjrdofkdkasznywvcxo.supabase.co','sb_publishable_hkqBaMme70g2f3wcxvaTKg_FczqkpCh',{auth:{persistSession:true,autoRefreshToken:true}});document.getElementById('check').onclick=async()=>{const s=document.getElementById('status');s.textContent='Checking…';try{const{data,error}=await c.auth.getUser();if(error)throw error;if(!data.user){s.textContent='No HTTPS session';return}const{data:rows,error:e}=await c.from('nxs_memberships').select('role,active,expires_at').eq('user_id',data.user.id).eq('active',true);if(e)throw e;const active=(rows||[]).filter(x=>!x.expires_at||Date.parse(x.expires_at)>Date.now());if(!active.length){s.textContent='Signed in · No active NXS membership confirmed';return}const roles=active.map(x=>String(x.role||'unknown'));const canWrite=roles.some(x=>['r4','r5','admin'].includes(x.toLowerCase()));s.textContent='Signed in · Active NXS membership confirmed\nMembership role: '+roles.join(', ')+'\nR4+ role indicated: '+(canWrite?'YES':'NO')+'\nActual write permission: NOT tested (requires server-side RLS verification)'}catch(e){s.textContent='Check unavailable: '+e.message}};</script></html>
