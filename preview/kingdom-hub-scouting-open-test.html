<script>
const mapButton=document.getElementById('mapButton'),kvkButton=document.getElementById('kvkButton'),scoutButton=document.getElementById('scoutButton');
const map=document.getElementById('map'),kvk=document.getElementById('kvk'),scouting=document.getElementById('scouting');
let kvkLoaded=false,scoutLoaded=false;
function activate(section){
 if(!['map','kvk','scouting'].includes(section))section='map';
 document.body.classList.toggle('kvk',section==='kvk');
 document.body.classList.toggle('scouting',section==='scouting');
 document.getElementById('sectionTitle').textContent=section==='kvk'?'KvK Prep':section==='scouting'?'Transfer Scouting':'Outpost Map';
 mapButton.setAttribute('aria-pressed',String(section==='map'));
 kvkButton.setAttribute('aria-pressed',String(section==='kvk'));
 scoutButton.setAttribute('aria-pressed',String(section==='scouting'));
 if(section==='kvk'&&!kvkLoaded){kvk.src='./kvk-prep-public-demo.html?build=20260928-open-test';kvkLoaded=true;}
 if(section==='scouting'&&!scoutLoaded){scouting.src='./transfer-scouting-demo-v5.html';scoutLoaded=true;}
 history.replaceState(null,'','?view='+section);
 dismissKeyboard.hidden=true;
}
kvk.addEventListener('load',()=>{try{const nested=kvk.contentDocument.querySelector('header');if(nested)nested.style.display='none';}catch(e){console.warn('Dashboard header isolation',e);}});

const dismissKeyboard=document.getElementById('dismissKeyboard');
function isTypingElement(el){
 if(!el||!el.matches)return false;
 if(el.matches('textarea,[contenteditable=""],[contenteditable="true"]'))return true;
 return el.matches('input:not([type="button"]):not([type="submit"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]):not([type="range"]):not([type="color"]):not([type="reset"])');
}
function focusedInput(){
 for(const frame of [map,kvk,scouting]){
  try{const el=frame.contentDocument?.activeElement;if(el&&isTypingElement(el))return el;}
  catch(e){/* Third-party content cannot be read; no control applied. */}
 }
 return isTypingElement(document.activeElement)?document.activeElement:null;
}
function updateKeyboardButton(){dismissKeyboard.hidden=!focusedInput();}
function connectKeyboardSupport(frame){
 try{
  const doc=frame.contentDocument;
  if(!doc)return;
  doc.addEventListener('focusin',updateKeyboardButton);
  doc.addEventListener('focusout',()=>setTimeout(updateKeyboardButton,90));
  doc.addEventListener('visibilitychange',updateKeyboardButton);
 }catch(e){/* Not all iframe documents permit shared input management. */}
}
[map,kvk,scouting].forEach(frame=>{
 frame.addEventListener('load',()=>{connectKeyboardSupport(frame);updateKeyboardButton();});
 connectKeyboardSupport(frame);
});
document.addEventListener('focusin',updateKeyboardButton);
document.addEventListener('focusout',()=>setTimeout(updateKeyboardButton,90));
dismissKeyboard.addEventListener('pointerdown',e=>e.preventDefault());
dismissKeyboard.onclick=()=>{
 const el=focusedInput();
 if(el)el.blur();
 try{document.activeElement?.blur();}catch(e){}
 dismissKeyboard.hidden=true;
};
mapButton.onclick=()=>activate('map');
kvkButton.onclick=()=>activate('kvk');
scoutButton.onclick=()=>activate('scouting');
activate(new URLSearchParams(location.search).get('view')||'map');
</script></body></html>
