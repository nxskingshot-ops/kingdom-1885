<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHALANX Alpha · route smoke checks</title><style>body{background:#071522;color:#e7d7b0;font:15px system-ui;padding:16px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #78633b;text-align:left;word-break:break-word}button{padding:12px;min-height:44px}small{color:#aaa}</style></head><body><h1>PHALANX Alpha · Route smoke checks</h1><p>Isolierte Testdateien. Prüft HTTP-Antworten und HTML-Formate, nicht Modulinteraktionen, Design-FREEZE oder Android.</p><button id="run">Erneut prüfen</button><table><thead><tr><th>Modul</th><th>Ergebnis</th></tr></thead><tbody id="results"></tbody></table><small id="summary" role="status"></small><script>(()=>{'use strict';const routes=[['HOME archival (not approved Alpha12)','../backups/NEXUS_PHALANX_HOME_FROZEN_2026-10-11.html'],['Legacy navigation sandbox','./nexus-phalanx-navigation-sandbox-2026-10-12.html'],['Command Center legacy','./nexus-app-2-command-center-portrait-final-polish-test.html'],['Existing app','./kingdom-hub-menu-test.html'],['Rally','./phalanx-rally-selection-alpha32-2026-10-12.html'],['Monte Carlo','./phalanx-monte-carlo-lab-alpha31-2026-10-12.html'],['Integration shell','./phalanx-alpha-android-integration-20261017.html']];const table=document.querySelector('#results'),summary=document.querySelector('#summary');async function run(){document.querySelector('#run').disabled=true;table.replaceChildren();let ok=0;for(const [name,path] of routes){const row=document.createElement('tr'),label=document.createElement('td'),result=document.createElement('td');label.textContent=name;result.textContent='Prüfung läuft';row.append(label,result);table.append(row);try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const html=await r.text();if(!/<(?:!doctype\s+html|html|meta\s+charset)/i.test(html.slice(0,800)))throw Error('Kein HTML-Dokument');result.textContent='HTTP '+r.status+' · HTML vorhanden';ok++}catch(e){result.textContent='FEHLER: '+String(e.message||e)}}summary.textContent=ok+'/'+routes.length+' Dokumente erreichbar. Funktionen und visuelle FREEZEs NICHT verifiziert.';document.querySelector('#run').disabled=false}document.querySelector('#run').addEventListener('click',run);run()})();</script></body></html>
