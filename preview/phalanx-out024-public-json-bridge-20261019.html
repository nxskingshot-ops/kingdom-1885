<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PHALANX OUT-024 Import Bridge</title><style>:root{color-scheme:dark}body{margin:0;padding:20px;background:#03111b;color:#f4e1b5;font:16px system-ui}main{max-width:720px;margin:auto;padding:20px;background:#092235;border:1px solid #c89b49;border-radius:16px}h1{color:#f7d78a}textarea{width:100%;box-sizing:border-box;min-height:180px;background:#061725;color:white;border:1px solid #c89b49;border-radius:8px;padding:10px}button,a{display:inline-block;background:#183249;color:#ffe3a4;border:1px solid #d9aa52;border-radius:9px;padding:12px;margin:6px 0}button:disabled{opacity:.5}</style><main><h1>⚔ OUT-024 · geprüfter Datenimport</h1><p>Lokaler, schreibgeschützter Test: Füge einen JSON-Export mit verifizierten OUT-024-Daten ein. Keine Netzwerkanfragen, kein Speichern, keine Änderungen an der Karte.</p><label for="source">OUT-024-Daten (source_key, alliance, coord_x, coord_y)</label><textarea id="source" spellcheck="false"></textarea><button id="check">Daten prüfen</button> <button id="copy" disabled>Geprüfte Daten kopieren</button> <button id="handoff" disabled>Prüfen, kopieren &amp; Report Center öffnen</button> <button id="direct" disabled>Direkt ans Report Center übergeben (Test)</button><p id="status" role="status">Noch keine Daten geprüft.</p><a href="./phalanx-reports-out024-local-adapter-20261019.html">Report Center öffnen</a><script>(()=>{'use strict';const source=document.getElementById('source'),status=document.getElementById('status'),copy=document.getElementById('copy'),handoff=document.getElementById('handoff'),direct=document.getElementById('direct');let approved='';source.addEventListener('input',()=>{approved='';copy.disabled=true;handoff.disabled=true;direct.disabled=true;status.textContent='Eingabe geändert. Erneut prüfen.'});document.getElementById('check').addEventListener('click',()=>{approved='';copy.disabled=true;handoff.disabled=true;direct.disabled=true;try{const rows=JSON.parse(source.value);if(!Array.isArray(rows)||rows.length===0||rows.length>1000)throw Error('Erwartet werden 1–1000 Einträge.');const ids=new Set();const clean=rows.map((r,i)=>{if(!r||typeof r!=='object'||Array.isArray(r)||typeof r.source_key!=='string'||typeof r.alliance!=='string'||typeof r.coord_x!=='number'||typeof r.coord_y!=='number')throw Error('Ungültige Felder in Eintrag '+(i+1));const id=r.source_key.trim(),alliance=r.alliance.trim(),x=r.coord_x,y=r.coord_y;if(!id||id.length>80||ids.has(id)||!alliance||alliance.length>80||!Number.isFinite(x)||!Number.isFinite(y)||x<0||x>1199||y<0||y>1199)throw Error('Ungültige Daten in Eintrag '+(i+1));ids.add(id);return{source_key:id,alliance,coord_x:x,coord_y:y}});approved=JSON.stringify(clean);copy.disabled=false;handoff.disabled=false;direct.disabled=false;status.textContent=clean.length+' Einträge geprüft. Keine Daten übertragen.'}catch(e){status.textContent='Import abgelehnt: '+e.message}});copy.addEventListener('click',async()=>{if(!approved)return;try{await navigator.clipboard.writeText(approved);status.textContent='Geprüfte Daten kopiert. Im Report Center einfügen.'}catch{status.textContent='Kopieren nicht verfügbar.'}});handoff.addEventListener('click',async()=>{if(!approved)return;try{await navigator.clipboard.writeText(approved);window.location.assign('./phalanx-reports-out024-local-adapter-20261019.html')}catch{status.textContent='Zwischenablage nicht verfügbar. Bitte Daten manuell kopieren.'}});document.getElementById('direct').addEventListener('click',()=>{if(!approved)return;const target=new URL('./phalanx-reports-out024-local-adapter-20261019.html',location.href);const child=window.open(target.href,'_blank');if(!child){status.textContent='Popup blockiert. Bitte Kopieren verwenden.';return}let attempts=0;const interval=setInterval(()=>{if(child.closed||attempts++>=20){clearInterval(interval);if(!child.closed)status.textContent='Direkte Übergabe nicht bestätigt. Bitte Kopieren verwenden.';return}try{child.postMessage({type:'PHALANX_OUT024_IMPORT_V1',payload:approved},target.origin)}catch{clearInterval(interval);status.textContent='Direkte Übergabe fehlgeschlagen.'}},250);const onMessage=e=>{if(e.origin!==target.origin||e.source!==child||e.data?.type!=='PHALANX_OUT024_ACK_V1')return;clearInterval(interval);window.removeEventListener('message',onMessage);status.textContent='Direkte Übergabe vom Report Center bestätigt.'};window.addEventListener('message',onMessage)});})();</script></main></html>
