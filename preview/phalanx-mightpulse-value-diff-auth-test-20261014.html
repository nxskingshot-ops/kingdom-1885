<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHALANX · Wertevergleich (Test)</title><style>body{margin:0;background:radial-gradient(ellipse at top,#243751,#0c1324 75%);color:#f4e9cf;font:16px system-ui;padding:20px}main{max-width:470px;margin:30px auto;border:1px solid #967b45;border-radius:20px;padding:22px;background:#121d31;box-shadow:0 0 28px #c5a85c22}h1{font-size:23px;color:#e7c97e}p{line-height:1.5;color:#d5d6dc}input,button,select{box-sizing:border-box;width:100%;border-radius:10px;padding:13px;margin:6px 0;font:inherit}input,select{background:#0b1425;color:white;border:1px solid #6c7390}button{border:1px solid #d1aa5b;background:#6e552b;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55}small{color:#aeb8c8}#output{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1425;padding:14px;border-radius:10px;line-height:1.6}</style></head><body><main><h1>🛡️ NEXUS PHALANX</h1><p>MightPulse · Gesicherter Wertevergleich · isolierter Test</p><small>Produktive App und Alpha35 bleiben unverändert. Keine Schlüssel eingeben.</small><div id="auth"><p>Mit deinem PHALANX-Testkonto anmelden:</p><form id="login"><input id="email" type="email" autocomplete="username" placeholder="E-Mail" required><input id="password" type="password" autocomplete="current-password" placeholder="Passwort" required><button type="submit">Anmelden</button></form></div><p id="authstatus" role="status"></p><section id="controls" hidden><label for="board">Ranking</label><select id="board"><option value="personal_power">Spieler-Power</option><option value="alliance_power">Allianz-Power</option><option value="kills">Kills</option><option value="troop_power">Truppen-Power</option><option value="hero_total">Helden-Power</option><option value="gov_gear">Gouverneur-Ausrüstung</option><option value="gov_charm">Gouverneur-Charms</option></select><button id="compare">Gespeicherte Datenstände vergleichen</button><p id="output" role="status">Noch kein Vergleich gestartet.</p></section><button id="logout" hidden>Abmelden</button></main><script type="module">import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const supabase=createClient("https://hcjrdofkdkasznywvcxo.supabase.co","sb_publishable_hkqBaMme70g2f3wcxvaTKg_FczqkpCh");const auth=document.getElementById("auth"),status=document.getElementById("authstatus"),controls=document.getElementById("controls"),logout=document.getElementById("logout"),output=document.getElementById("output"),button=document.getElementById("compare");async function render(){const {data:{session}}=await supabase.auth.getSession();auth.hidden=!!session;controls.hidden=!session;logout.hidden=!session;status.textContent=session?"✓ Angemeldet · Vergleich bereit":"Bitte anmelden."}document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();status.textContent="Anmeldung läuft …";const {error}=await supabase.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error){status.textContent="Anmeldung fehlgeschlagen: "+error.message;return}document.getElementById("password").value="";await render()});button.onclick=async()=>{button.disabled=true;output.textContent="Vergleich läuft …";try{const board=document.getElementById("board").value;const {data:{session}}=await supabase.auth.getSession();if(!session?.access_token)throw new Error("Sitzung abgelaufen");const response=await fetch("https://hcjrdofkdkasznywvcxo.supabase.co/functions/v1/phalanx-mightpulse-value-diff-test?board="+encodeURIComponent(board),{method:"GET",headers:{"Authorization":"Bearer "+session.access_token,"apikey":"sb_publishable_hkqBaMme70g2f3wcxvaTKg_FczqkpCh"}});const data=await response.json();const error=response.ok?null:new Error(data?.error||"HTTP "+response.status);if(error)throw error;if(!data?.ok)throw new Error(data?.error||"Vergleich fehlgeschlagen");output.textContent="";if(!data.compared)output.textContent+="Noch kein zweiter unterschiedlicher MightPulse-Quellenstand vorhanden. Keine Veränderung behauptet.";else output.textContent+=(data.hasChanges?"✓ "+data.changedCount+" Änderungen erkannt.":"✓ Keine Wertänderungen bei den verglichenen Einträgen.")+"\nQuellenstände: "+data.previousSourceCapturedAt+" → "+data.latestSourceCapturedAt+"\n"+(data.changes||[]).slice(0,12).map(x=>(x.name||x.id)+": "+(x.scoreDelta??"?")+" Punkte, Rang "+(x.rankImprovement??"?")).join("\n");}catch(e){output.textContent="⚠ Vergleich nicht möglich: "+(e?.message||"Verbindungsfehler")+". Anmeldung und Berechtigungen prüfen."}finally{button.disabled=false}};logout.onclick=async()=>{await supabase.auth.signOut();await render()};await render();</script></body></html>
