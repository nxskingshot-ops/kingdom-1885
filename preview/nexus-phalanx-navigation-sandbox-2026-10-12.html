<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEXUS PHALANX · Integration Sandbox</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#03111b;color:#f4e1b5}*{box-sizing:border-box}body{margin:0}header{padding:12px 16px;background:#071a2b;border-bottom:2px solid #d5a83c}h1{font:700 20px Georgia,serif;color:#f6d36b;margin:0}p{font-size:12px;color:#b8c8d8}nav{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#0b2435}button{flex:none;border:1px solid #9a7846;border-radius:8px;padding:9px 11px;background:#172c42;color:#f6e4bd;font-weight:600}button[aria-selected="true"]{background:#a47c32;color:#081522}html{height:100%}body{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}header,nav,#status{flex:0 0 auto}main{display:flex;flex:1 1 0;min-height:0;overflow:hidden}iframe{display:block;flex:1 1 auto;min-width:0;min-height:0;width:100%;height:100%;border:0;background:#03111b}#status{padding:4px 12px;font-size:12px;color:#c4d4df;background:#081827}</style></head>
<body><header><h1>⚔ NEXUS PHALANX · INTEGRATION SANDBOX</h1><p>TEST ONLY · Existing frozen Command Center and production app are not modified. Linked tools are independent previews.</p></header>
<nav role="tablist" aria-label="Integration modules">
<button role="tab" data-page="command" aria-selected="true">Command Center</button>
<button role="tab" data-page="rally" aria-selected="false">Rally Skills</button>
<button role="tab" data-page="monte" aria-selected="false">Monte Carlo</button>
<button role="tab" data-page="hub" aria-selected="false">Existing App</button></nav>
<div id="status" role="status">Command Center preview · not production</div>
<main><iframe id="module" title="Command Center preview" src="./nexus-app-2-command-center-portrait-final-polish-test.html"></iframe></main>
<script>
(()=>{'use strict';
const modules={command:['./nexus-app-2-command-center-portrait-final-polish-test.html','Command Center preview'],rally:['./phalanx-rally-selection-alpha32-2026-10-12.html','Rally Skills Alpha32'],monte:['./phalanx-monte-carlo-lab-alpha31-2026-10-12.html','Monte Carlo Alpha31'],hub:['./kingdom-hub-menu-test.html','Existing App preview']};
const frame=document.getElementById('module'),status=document.getElementById('status'),buttons=[...document.querySelectorAll('[data-page]')];
let active='command';
function select(key,record=true){
 if(!Object.hasOwn(modules,key))return;
 const changed=key!==active;
 const [url,title]=modules[key];
 active=key;
 buttons.forEach(b=>{const selected=b.dataset.page===key;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;});
 if(changed||frame.getAttribute('src')!==url){frame.title=title;status.textContent=title+' · loading preview…';frame.src=url;}
 if(!changed)status.textContent=title+' · preview selected';
 if(record&&changed)history.pushState({module:key},'', '#'+key);
}
buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.page)));
window.addEventListener('popstate',()=>select(Object.hasOwn(modules,location.hash.slice(1))?location.hash.slice(1):'command',false));
window.addEventListener('hashchange',()=>select(Object.hasOwn(modules,location.hash.slice(1))?location.hash.slice(1):'command',false));
const hash=location.hash.slice(1);if(Object.hasOwn(modules,hash))select(hash,false);
frame.addEventListener('load',()=>{status.textContent=frame.title+' · document loaded (data and controls not verified)';});
frame.addEventListener('error',()=>{status.textContent='Module document could not be loaded; verify deployment and permissions';});
})();
</script></body></html>
