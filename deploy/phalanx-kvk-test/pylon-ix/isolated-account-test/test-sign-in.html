<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHALANX · Isolated sign-in</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#020d17;color:#f1e3c8;font:16px/1.5 system-ui}main{max-width:480px;margin:30px auto;padding:18px}h1{color:#f2ca82;font-family:Georgia,serif}.card{background:#0c1e2b;border:1px solid #bc914d;border-radius:8px;padding:18px}label{display:block;margin:12px 0}.password-row{display:flex;gap:8px;align-items:stretch}.password-row input{flex:1;min-width:0}.password-row button{width:auto;min-width:88px;white-space:nowrap}.password-row button[aria-pressed=true]{background:#705027}input,button{font:inherit;min-height:44px;padding:10px;width:100%;background:#102432;color:#fff;border:1px solid #bc914d}button{background:#44301c;color:#ffe1a4;cursor:pointer}a{color:#f2ca82}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #f2ca82}small{color:#bac4cc}</style></head><body><main><h1>PHALANX · TEST SIGN-IN</h1><section class="card"><p>Isolated test environment only. Use an existing isolated test account. No production credentials required.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label for="password">Password</label><div class="password-row"><input id="password" type="password" autocomplete="current-password" aria-label="Password" required><button id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button></div><button id="submit" type="submit">Sign in</button></form><p id="status" role="status" aria-live="polite"></p><button id="signout" type="button" hidden>Sign out</button><p><a href="./phx-registration-review-v2.html">Registration review</a> · <a href="./phx-member-permissions-v2.html">Member permissions</a></p><small>Access is server-authorized. Kingshot ranks alone grant no app privileges.</small></section></main><script>document.getElementById("toggle-password").addEventListener("click",function(){const p=document.getElementById("password");const show=p.type==="password";p.type=show?"text":"password";this.textContent=show?"Hide":"Show";this.setAttribute("aria-pressed",String(show));});</script><script type="module" src="./test-sign-in.js"></script></body></html>
