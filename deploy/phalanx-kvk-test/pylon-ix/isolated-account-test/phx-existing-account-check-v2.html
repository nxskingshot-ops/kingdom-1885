<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHALANX · Existing account check</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#020d17;color:#f1e3c8;font:16px/1.5 system-ui}main{max-width:480px;margin:30px auto;padding:18px}h1{color:#f2ca82;font-family:Georgia,serif}.card{background:#0c1e2b;border:1px solid #bc914d;border-radius:8px;padding:18px}label{display:block;margin:12px 0}input,button{font:inherit;min-height:44px;padding:10px;width:100%;background:#102432;color:#fff;border:1px solid #bc914d}button{background:#44301c;color:#ffe1a4;cursor:pointer}small{color:#bac4cc}button:focus-visible,input:focus-visible{outline:2px solid #f2ca82}</style></head><body><main><h1>PHALANX · EXISTING ACCOUNT CHECK</h1><section class="card"><p>Staging-only, read-only membership verification against the existing PHALANX account. No registration, password reset, or role changes.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Sign in</button></form><p id="status" role="status" aria-live="polite"></p><p id="details"></p><button id="signout" type="button" hidden>Sign out</button><small>This is not the Access V2 role editor. Legacy membership never grants an Access V2 role automatically.</small></section></main><script type="module" src="./phx-existing-account-check-v2.js"></script></body></html>
