<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHALANX · Existing Access Management</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07121d;color:#f4e5ca;font:15px/1.5 system-ui}main{max-width:780px;margin:auto;padding:clamp(12px,3vw,20px)}h1,h3{color:#edc278}h1{font-size:clamp(24px,5vw,34px);line-height:1.15;margin:6px 0 12px}h3{margin:0 0 12px;font-size:19px}label{display:block;margin:8px 0}.card{background:#142434;border:1px solid #b98b46;border-radius:9px;padding:12px;margin:10px 0}button{padding:9px 12px;background:#49331c;color:#ffe2ad;border:1px solid #d2a45e;border-radius:6px;min-height:44px}button:disabled{opacity:.5}input,select{display:block;width:100%;padding:9px;margin:4px 0 9px;background:#0b1b2a;color:#fff;border:1px solid #b98b46}p{overflow-wrap:anywhere;margin:8px 0}#status{font-size:14px;color:#c4d3dc}#invite p{font-size:12px;color:#b7c3cc}@media(max-width:480px){main{padding:12px}.card{padding:12px}button{width:100%}}</style></head><body><main><h1>PHALANX · ACCESS MANAGEMENT</h1><p>Manage existing PHALANX accounts. Access V2 role assignments are not enabled yet.</p><form id="login" class="card" hidden><label>Email <input id="email" type="email" autocomplete="username" required></label><label>Password <input id="password" type="password" autocomplete="current-password" required></label><button id="sign-in" type="submit">Sign in with existing account</button></form><button id="refresh">Refresh members</button><p id="status" role="status" aria-live="polite">Checking session…</p><form id="invite" class="card" hidden><h3>Invite member</h3><label>Email<input id="invite-email" type="email" required></label><label>Kingshot Player ID<input id="invite-player" inputmode="numeric" pattern="[1-9][0-9]{0,19}" required></label><label>Existing access role<select id="invite-role" required><option value="" selected disabled>Select role</option><option value="member">Member</option><option value="kingdom">Kingdom</option></select></label><button id="send-invite" type="submit">Record invitation</button><p>Access V2 roles are not yet enabled; no administrator rights are granted here.</p></form><h3>Open invitations</h3><div id="invitations"></div><h3>Member accounts</h3><div id="members"></div></main><script type="module" src="./phx-existing-access-management.js"></script></body></html>
