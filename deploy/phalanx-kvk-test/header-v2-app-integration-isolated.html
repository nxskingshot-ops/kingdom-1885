<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>PHALANX – Header V2 App Integration (isoliert)</title>
<link rel="stylesheet" href="./src/phalanx-unified-header-v2-isolated.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#020b15;color:#f3d9a2;font:15px system-ui,sans-serif}
#app{max-width:760px;margin:auto}#content{padding:16px 14px 40px}
h2{font:700 24px Georgia,serif;margin:8px 0 14px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;justify-content:center;min-height:100px;padding:12px;background:#0b2030;border:1px solid #b58b46;border-radius:12px;color:#f3d9a2;text-decoration:none;font-weight:700}
.tile small{font-weight:400;color:#b8c9d2;margin-top:6px}
button{font:inherit}#menu{border:1px solid #cba15b;border-radius:10px;padding:12px;margin-bottom:14px;background:#081b29}
#menu[hidden]{display:none}#menu a{display:block;color:#f3d9a2;padding:12px;border-bottom:1px solid #765e3b}
#menu a:last-child{border-bottom:0}.notice{color:#c3d3dc;font-size:13px;line-height:1.5}
.phalanx-section-heading{font:500 clamp(18px,4vw,25px) Georgia,serif;text-align:center;letter-spacing:.07em;color:#f5d5a0;margin:26px 0 12px}
.phalanx-freeze-tiles{margin-bottom:20px}
.phalanx-freeze-tile{position:relative;overflow:hidden;align-items:flex-start;text-align:left;gap:6px;min-height:clamp(105px,19vw,155px);padding:20px 17px 18px 21px;background:radial-gradient(ellipse at 80% 10%,#d9a45730,transparent 55%),linear-gradient(145deg,#283d45,#102430 53%,#07121b);border:2px ridge #a77b3a;border-radius:7px;box-shadow:inset 0 0 0 2px #231e17,inset 0 0 0 4px #d9ae6570,inset 0 0 35px #b78c3e26,0 5px 12px #0008;color:#f6dda8;isolation:isolate;transition:filter .18s,transform .18s}
.phalanx-freeze-tile::before{content:'';position:absolute;inset:7px;z-index:-1;pointer-events:none;border:1px solid #e3bc6a5e;box-shadow:inset 0 0 20px #02080c;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.phalanx-freeze-tile::after{content:'❯';position:absolute;right:14px;bottom:12px;font:18px Georgia,serif;color:#d6b36e;text-shadow:0 0 9px #f7ce6c8a}
.phalanx-freeze-tile:not(:disabled):hover{filter:brightness(1.14);transform:translateY(-2px)}
.phalanx-freeze-tile:not(:disabled):active{transform:translateY(0)}
.phalanx-freeze-tile strong{text-shadow:0 2px 5px #000;position:relative}
.phalanx-freeze-tile small{position:relative;text-shadow:0 2px 4px #000}
.phalanx-freeze-tiles{row-gap:13px}
.phalanx-freeze-tiles--three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:520px){#content{padding:12px 10px 35px}.phalanx-freeze-tiles{gap:9px}.phalanx-freeze-tile{padding:16px 10px 23px 13px;min-height:110px}.phalanx-freeze-tiles--three .phalanx-freeze-tile{min-height:135px;padding:13px 8px 22px}.phalanx-freeze-tile strong{font-size:clamp(10px,2.6vw,14px)}.phalanx-freeze-tile small{font-size:10px;overflow-wrap:anywhere}}
@media(prefers-reduced-motion:reduce){.phalanx-freeze-tile{transition:none}}
.phalanx-freeze-tile strong{font:500 clamp(13px,2.8vw,18px) Georgia,serif}
.phalanx-freeze-tile small{font:400 12px system-ui,sans-serif;color:#c2b8a4}
.phalanx-freeze-tile:disabled{opacity:.56;cursor:not-allowed}
.phalanx-freeze-tile:focus-visible{outline:3px solid #ffe0a1;outline-offset:3px}
/* GLOBAL FREEZE: consistent identity bar and legible decorative cards. Demo identity is explicitly labelled. */
.phalanx-identity{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:linear-gradient(110deg,#071320,#14212b 50%,#080f17);border-bottom:1px solid #9b713b;color:#f5d7a0}
.phalanx-identity__profile{display:flex;align-items:center;gap:9px;min-width:0}
.phalanx-identity__avatar{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border:2px double #e1b765;border-radius:50%;background:radial-gradient(circle,#574323,#0a1722);font-size:23px}
.phalanx-identity__name{font:700 19px Georgia,serif;letter-spacing:.025em}
.phalanx-identity__level{font:11px system-ui,sans-serif;color:#d8c5a1}
.phalanx-identity__right{display:flex;align-items:center;gap:8px;font:12px system-ui,sans-serif}
.phalanx-identity__chip{border:1px solid #ac8546;padding:7px 8px;border-radius:6px;white-space:nowrap;background:#0a1823}
.phalanx-identity__demo{font:10px system-ui,sans-serif;color:#d5b77c;letter-spacing:.06em}
.phalanx-freeze-tile:disabled{opacity:1;cursor:not-allowed;border-color:#8c7149}
.phalanx-freeze-tile:disabled strong,.phalanx-freeze-tile:disabled small{color:#f0d6a2}
.phalanx-freeze-tile:disabled::after{content:'⌛';font-size:13px}
@media(max-width:390px){.phalanx-identity{padding:8px}.phalanx-identity__right{gap:4px}.phalanx-identity__chip{font-size:10px;padding:5px}.phalanx-identity__name{font-size:16px}.phalanx-identity__avatar{width:34px;height:34px;flex-basis:34px}}
/* Mobile readability: overrides earlier generic card rules, not the approved art. */
.phalanx-freeze-tile strong{font-size:clamp(12px,2.6vw,18px);line-height:1.18;overflow-wrap:anywhere;hyphens:auto}
.phalanx-freeze-tile small{font-size:clamp(10px,2.1vw,12px);line-height:1.3;overflow-wrap:anywhere}
.phalanx-freeze-tiles--three .phalanx-freeze-tile{padding-inline:clamp(8px,1.8vw,17px)}
.phalanx-freeze-tiles--three .phalanx-freeze-tile strong{font-size:clamp(11px,2.25vw,16px);line-height:1.2}
.phalanx-freeze-tiles--three .phalanx-freeze-tile small{font-size:clamp(10px,1.85vw,12px)}
@media(max-width:430px){
 .phalanx-freeze-tiles--three{grid-template-columns:repeat(2,minmax(0,1fr))}
 .phalanx-freeze-tiles--three .phalanx-freeze-tile{min-height:118px}
 .phalanx-freeze-tiles--three .phalanx-freeze-tile strong{font-size:clamp(12px,3.3vw,15px)}
 .phalanx-freeze-tiles--three .phalanx-freeze-tile small{font-size:11px}
}
@media(max-width:330px){.phalanx-identity__right{flex-direction:column;align-items:flex-end}.phalanx-freeze-tiles{gap:7px}}
/* Shared visual tokens for HOME, module and detail: GLOBAL PHALANX FREEZE. */
:root{--phx-gold:#dfb86e;--phx-gold-deep:#8d642d;--phx-ink:#03101a;--phx-border:2px ridge var(--phx-gold-deep)}
.phalanx-module-tiles .tile{position:relative;min-height:120px;padding:18px 20px;border:var(--phx-border);border-radius:7px;background:radial-gradient(ellipse at top right,#9b784528,transparent 70%),linear-gradient(145deg,#21313a,#071622);box-shadow:inset 0 0 0 3px #1b1a18,inset 0 0 0 4px #b9975a8a,0 4px 13px #0007;font:500 clamp(16px,3.5vw,21px) Georgia,serif;text-align:left;color:#f5dca8}
.phalanx-module-tiles .tile::after{content:'❯';position:absolute;right:16px;bottom:13px;color:#dbb777}
.phalanx-module-tiles .tile:focus-visible{outline:3px solid #ffdda0;outline-offset:3px}
.phalanx-module-tiles .tile:not(:disabled):active{filter:brightness(1.25)}
.phalanx-detail-link{display:block;border:var(--phx-border);padding:16px 20px;background:linear-gradient(130deg,#1e3440,#06121d);border-radius:8px;color:#f5dca8;font:500 18px Georgia,serif}
.phalanx-detail-link:focus-visible{outline:3px solid #ffdda0}
.phalanx-embedded-frame{display:block;width:100%;height:70vh;border:2px ridge #a57b42;border-radius:8px;background:#071725;box-shadow:0 5px 24px #0008}
/* Real FREEZE artwork slot: image is decorative; labels/actions remain real DOM. */
.phalanx-freeze-tile__art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;pointer-events:none}
.phalanx-freeze-tile:has(.phalanx-freeze-tile__art){background:linear-gradient(145deg,#1a2930,#06121a)}
.phalanx-freeze-tile:has(.phalanx-freeze-tile__art)::before{background:linear-gradient(90deg,#020911db 0%,#020911b0 55%,#0209114a 100%)}
.phalanx-freeze-tile__copy{display:flex;flex-direction:column;gap:5px;max-width:100%;min-width:0}
.phalanx-freeze-tile__copy strong,.phalanx-freeze-tile__copy small{display:block;position:relative}
/* Exact cropped FREEZE cards already contain typography, icons and ornamentation.
   Do not draw duplicate titles, gradient masks or chevrons over approved imagery. */
.phalanx-freeze-tile[data-artwork-status="loaded"]{padding:0;min-height:0;aspect-ratio:475 / 146;background:none;border:0;box-shadow:none;border-radius:0}
.phalanx-freeze-tiles--three .phalanx-freeze-tile[data-artwork-status="loaded"]{aspect-ratio:313 / 156;min-height:0;padding:0}
.phalanx-freeze-tile[data-artwork-status="loaded"] .phalanx-freeze-tile__art{z-index:0;object-fit:fill}
.phalanx-freeze-tile[data-artwork-status="loaded"]::before,.phalanx-freeze-tile[data-artwork-status="loaded"]::after{display:none}
.phalanx-freeze-tile[data-artwork-status="loaded"] .phalanx-freeze-tile__copy{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.phalanx-freeze-tile[data-artwork-status="loaded"]:disabled{filter:none}
.phalanx-freeze-tile[data-artwork-status="loaded"]:focus-visible{outline:3px solid #ffe0a1;outline-offset:3px}
/* FREEZE: the three approved illustrated cards remain three across, including mobile. */
@media(max-width:430px){
 .phalanx-freeze-tiles--three{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
 .phalanx-freeze-tiles--three .phalanx-freeze-tile[data-artwork-status="loaded"]{aspect-ratio:313 / 156;min-height:0;padding:0}
 .phalanx-freeze-tiles--three .phalanx-freeze-tile:not([data-artwork-status="loaded"]){min-height:75px;padding:6px}
 .phalanx-freeze-tiles--three .phalanx-freeze-tile:not([data-artwork-status="loaded"]) strong{font-size:10px}
 .phalanx-freeze-tiles--three .phalanx-freeze-tile:not([data-artwork-status="loaded"]) small{font-size:9px}
}
.phalanx-freeze-tile[data-artwork-status="loaded"]:disabled::after{display:none}
</style></head>
<body><div id="app"><div id="identity" class="phalanx-identity" aria-label="Account-Vorschau">
<div class="phalanx-identity__profile"><span class="phalanx-identity__avatar" aria-hidden="true">♜</span><span><span class="phalanx-identity__name">FaQu</span><span class="phalanx-identity__demo"> · DEMO</span><span class="phalanx-identity__level" style="display:block">Level 27 · Vorschau, nicht angemeldet</span></span></div>
<div class="phalanx-identity__right"><span class="phalanx-identity__chip">◎ DE</span><span class="phalanx-identity__chip">♛ Kingdom #1885</span></div>
</div><div id="header"></div><main id="content"><div id="menu" hidden aria-label="Modulmenü"></div><section id="view"></section></main></div>
<script type="module">
import {mountPhalanxHeaderV2} from './src/phalanx-unified-header-v2-isolated.js';
const artwork={home:'./assets/header-v2/header-home.png',module:'./assets/header-v2/header-module.png',detail:'./assets/header-v2/header-detail.png'};
const approvedCardArtwork={
  "kvk-vorbereitung": "./assets/design-freeze/cards/kvk-vorbereitung.webp",
  "aussenposten": "./assets/design-freeze/cards/aussenposten.webp",
  "transfer-scouting": "./assets/design-freeze/cards/transfer-scouting.webp",
  "allianz-vergleich": "./assets/design-freeze/cards/allianz-vergleich.webp",
  "heldenrechner": "./assets/design-freeze/cards/heldenrechner.webp",
  "truppenratio": "./assets/design-freeze/cards/truppenratio.webp",
  "marsch-optimierung": "./assets/design-freeze/cards/marsch-optimierung.webp",
  "gegner-analyse": "./assets/design-freeze/cards/gegner-analyse.webp",
  "koenigreich-scout": "./assets/design-freeze/cards/koenigreich-scout.webp",
  "datenberichte": "./assets/design-freeze/cards/datenberichte.webp"
};
const destinations={
 war:{title:'KRIEG',items:[['KvK Vorbereitung','./kvk-prep-v13-epic-v2-test.html'],['Battle Readiness','./battle-readiness-isolated.html']]},
 alliance:{title:'ALLIANZ',items:[['Allianz-Trends','./alliance-trends-isolated.html']]},
 tools:{title:'WERKZEUGE',items:[['Heldenanalyse','./hero-intelligence-v15-isolated.html'],['Team Optimizer','./team-optimizer-alpha11-isolated.html']]},
 guides:{title:'GUIDES',items:[]},
 statistics:{title:'STATISTIKEN',items:[['PHALANX Ranking','./phalanx-ranking-integration-rc-20261015.html']]},
 info:{title:'INFO',items:[]}
};
const header=document.getElementById('header'),view=document.getElementById('view'),menu=document.getElementById('menu');
let state={mode:'home',section:'home',detail:null},history=[];
const embeddedModules=new Set(['./battle-readiness-isolated.html']);
function navigate(next){history.push({...state});state=next;render();}
function back(){state=history.pop()||{mode:'home',section:'home',detail:null};render();}
function el(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;}
function render(){
 menu.hidden=true;menu.replaceChildren();view.replaceChildren();
 const title=state.mode==='home'?'':state.mode==='module'?destinations[state.section]?.title||'PHALANX':state.detail?.title||'DETAIL';
 mountPhalanxHeaderV2(header,{mode:state.mode,title,artwork,activeDestination:state.section,
 onNavigate:section=>section==='home'?navigate({mode:'home',section:'home',detail:null}):navigate({mode:'module',section,detail:null}),
 onBack:back,onMenu:()=>{menu.hidden=!menu.hidden;}});
 if(state.mode==='home'){
   // Approved GLOBAL FREEZE: HOME is grouped into cinematic command, tools and intelligence sections.
   // Illustrated artwork remains a separate visual acceptance gate; never mark this scaffold pixel-perfect.
   const groups=[
     {heading:'COMMAND CENTER',cards:[
       {label:'KvK VORBEREITUNG',sub:'Übersicht · Analyse · Warnlisten',section:'war',item:'KvK Vorbereitung'},
       {label:'AUSSENPOSTEN',sub:'Karte · Berichte · Editor',section:null},
       {label:'TRANSFER SCOUTING',sub:'Kandidaten · Analyse · Einladungen',section:null},
       {label:'ALLIANZ VERGLEICH',sub:'NXS · FRA · OoO · MYM',section:'alliance'}]},
     {heading:'WERKZEUGE & RECHNER',cards:[
       {label:'HELDENRECHNER',sub:'Vergleich · Builds · Empfehlungen',section:'tools',item:'Heldenanalyse'},
       {label:'TRUPPENRATIO',sub:'Bär · Wikinger · KvK',section:null},
       {label:'MARSCH OPTIMIERUNG',sub:'Das habe ich · Das will ich',section:'tools',item:'Team Optimizer'}]},
     {heading:'INTELLIGENZ & BERICHTE',cards:[
       {label:'GEGNER ANALYSE',sub:'Top-Spieler · Aktivität · Risiko',section:null},
       {label:'KÖNIGREICH SCOUT',sub:'Rankings · Berichte · Trends',section:'statistics'},
       {label:'DATENBERICHTE',sub:'Live-Daten · Auto-Import',section:null}]}
   ];
   for(const group of groups){
     const heading=el('h2',group.heading,'phalanx-section-heading');
     const tiles=el('div',null,'tiles phalanx-freeze-tiles');
     if(group.cards.length===3)tiles.classList.add('phalanx-freeze-tiles--three');
     for(const card of group.cards){
       const b=el('button',null,'tile phalanx-freeze-tile');b.type='button';
       // Future artwork must be a verified approved local asset, never an invented image URL.
       // DOM text stays independent of the art so buttons remain accessible and functional.
       const copy=el('span',null,'phalanx-freeze-tile__copy');
       copy.append(el('strong',card.label),el('small',card.sub));
       b.append(copy);
       b.dataset.freezeCard=card.label.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
       b.setAttribute('aria-label',card.label+' – '+card.sub);
       card.artwork=approvedCardArtwork[b.dataset.freezeCard];
       if(card.artwork){
         if(!/^\.\/assets\/design-freeze\/cards\/[a-z0-9-]+\.(?:png|jpg|webp)$/.test(card.artwork)){
           throw new Error('Only verified isolated FREEZE card assets are permitted');
         }
         const art=document.createElement('img');
         art.className='phalanx-freeze-tile__art';
         art.src=card.artwork;art.alt='';art.loading='lazy';art.decoding='async';
         art.addEventListener('error',()=>{art.remove();b.dataset.artworkStatus='missing';});
         b.prepend(art);
         b.dataset.artworkStatus='pending';
         art.addEventListener('load',()=>{b.dataset.artworkStatus='loaded';});
       }else{
         b.dataset.artworkStatus='not-integrated';
       }
       if(card.section){
         b.addEventListener('click',()=>{
           const d=destinations[card.section];
           const match=card.item&&d.items.find(([name])=>name===card.item);
           if(match)navigate({mode:'detail',section:card.section,detail:{title:match[0],url:match[1]}});
           else navigate({mode:'module',section:card.section,detail:null});
         });
       }else{
         b.disabled=true;
         b.setAttribute('aria-label',card.label+' – noch nicht integriert');
         b.title='Noch keine geprüfte Zielseite integriert';
       }
       tiles.append(b);
     }
     view.append(heading,tiles);
   }
   // Technical acceptance notes belong in the test report, not in the user-facing HOME view.
 }else if(state.mode==='module'){
   const d=destinations[state.section];view.append(el('h2',d.title));
   if(!d.items.length)view.append(el('p','Für diesen Bereich ist noch keine geprüfte Zielseite zugeordnet.','notice'));
   const tiles=el('div',null,'tiles phalanx-module-tiles');
   for(const [name,url] of d.items){
     const b=el('button',name,'tile');b.type='button';b.addEventListener('click',()=>navigate({mode:'detail',section:state.section,detail:{title:name,url}}));tiles.append(b);
   }
   view.append(tiles);
   const menuTitle=el('strong','Bereichsmenü');menu.append(menuTitle);
   for(const [name,url] of d.items){const a=el('a',name);a.href=url;menu.append(a);}
 }else{
   if(!embeddedModules.has(state.detail.url))view.append(el('h2',state.detail.title));
   if(embeddedModules.has(state.detail.url)){
     const frame=document.createElement('iframe');frame.src=state.detail.url;frame.title=state.detail.title;
     frame.loading='eager';frame.scrolling='no';frame.className='phalanx-embedded-frame';
     frame.setAttribute('referrerpolicy','same-origin');
     frame.addEventListener('load',()=>{
       try{
         const doc=frame.contentDocument;
         if(!doc || new URL(frame.src).origin!==location.origin) return;
         const topbar=doc.querySelector('.topbar');
         if(!topbar) return;
         const style=doc.createElement('style');
         style.setAttribute('data-phalanx-embed','header-v2-isolated');
         style.textContent='.topbar{display:none!important}';
         doc.head.append(style);
         frame.dataset.embedHeaderHidden='true';
         const resize=()=>{
           if(!frame.isConnected)return;
           const height=Math.max(doc.documentElement.scrollHeight,doc.body?.scrollHeight||0);
           if(Number.isFinite(height)&&height>0)frame.style.height=Math.min(Math.max(height+4,400),30000)+'px';
         };
         resize();
         if(typeof ResizeObserver!=='undefined'){
           const observer=new ResizeObserver(resize);
           observer.observe(doc.documentElement);
           if(doc.body)observer.observe(doc.body);
           const cleanup=new MutationObserver(()=>{if(!frame.isConnected){observer.disconnect();cleanup.disconnect();}});
           cleanup.observe(view,{childList:true});
         }
       }catch(error){
         console.warn('Embedded module header remains visible:',error);
       }
     });
     view.append(frame);
   }else{
     const a=el('a','Bestehendes isoliertes Modul öffnen →','phalanx-detail-link');a.href=state.detail.url;view.append(a);
   }
   view.append(el('p','Bestehendes Testmodul unverändert eingebunden. Bei Problemen über das Menü separat öffnen.','notice'));
   const link=el('a','Modul öffnen');link.href=state.detail.url;menu.append(link);
 }
}
render();
</script></body></html>
