<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHALANX V2 – Isolierter Header-Test</title><link rel="stylesheet" href="../../src/phalanx-unified-header-v2-isolated.css"><style>body{margin:0;background:#03111b;color:#e8c477;font:16px system-ui}.controls{padding:14px;display:flex;gap:8px;flex-wrap:wrap}.controls button{padding:12px;color:#f4c773;background:#142635;border:1px solid #b68b42;border-radius:8px}#result{padding:12px;white-space:pre-wrap}</style></head><body><div class="controls"><button data-mode="home">HOME</button><button data-mode="module">MODUL</button><button data-mode="detail">DETAIL</button></div><main id="header"></main><output id="result" role="status"></output><script type="module">
import {mountPhalanxHeaderV2} from '../../src/phalanx-unified-header-v2-isolated.js';
const result=document.getElementById('result'),host=document.getElementById('header');
const artwork={home:'../../assets/header-v2/header-home.png',module:'../../assets/header-v2/header-module.png',detail:'../../assets/header-v2/header-detail.png'};
function render(mode){try{mountPhalanxHeaderV2(host,{mode,title:mode==='module'?'WAR ROOM':'HELDENRECHNER',artwork,onBack:()=>{result.textContent='Zurück aktiviert';render('home')},onMenu:()=>{result.textContent='Menü-Callback aktiviert'}});const img=host.querySelector('img');img.addEventListener('error',()=>{result.textContent='BLOCKIERT: genehmigtes Bildasset fehlt: '+img.src},{once:true});img.addEventListener('load',()=>{result.textContent=mode.toUpperCase()+' Bild geladen'},{once:true});}catch(e){result.textContent='Fehler: '+e.message}}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.mode)));render('home');
</script></body></html>
