<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>PHALANX · Zugang wiederherstellen</title>
<style>body{margin:0;background:#191713;color:#f0e2c5;font:16px system-ui}main{max-width:480px;margin:8vh auto;padding:24px;border:1px solid #a18450;background:#29251e;border-radius:12px}h1{font:27px Georgia}label{display:block;margin:18px 0}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:6px;border:1px solid #a18450}input{margin-top:7px;background:#fff7e8;color:#241e15}button{background:#c4a36a;color:#211a10;cursor:pointer}button:disabled{opacity:.5}a{color:#dfc18b}[hidden]{display:none!important}#status{white-space:pre-wrap;line-height:1.5}</style></head>
<body><main><h1>PHALANX · Zugang wiederherstellen</h1><p>Deine Kandidaten und Berechtigungen bleiben erhalten.</p>
<form id="requestForm"><label>E-Mail<input id="recoveryEmail" type="email" autocomplete="username" required></label><button type="submit">Rücksetzlink anfordern</button></form>
<form id="passwordForm" hidden><p>Du legst dein neues Passwort selbst fest. Gib es ausschließlich hier ein.</p><label>Neues Passwort<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label><label>Neues Passwort wiederholen<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Neues Passwort speichern</button></form>
<p id="status" role="status" aria-live="polite">Öffne diese Seite über deinen Rücksetzlink, um ein neues Passwort festzulegen.</p><p><a href="/">Zur Anmeldung</a></p>
<script type="module" src="./password-recovery.js"></script></main></body></html>
