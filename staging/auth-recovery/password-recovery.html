<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>PHALANX · Recover Access</title>
<style>body{margin:0;background:#191713;color:#f0e2c5;font:16px system-ui}main{max-width:480px;margin:8vh auto;padding:24px;border:1px solid #a18450;background:#29251e;border-radius:12px}h1{font:27px Georgia}label{display:block;margin:18px 0}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:6px;border:1px solid #a18450}input{margin-top:7px;background:#fff7e8;color:#241e15}button{background:#c4a36a;color:#211a10;cursor:pointer}button:disabled{opacity:.5}a{color:#dfc18b}[hidden]{display:none!important}#status{white-space:pre-wrap;line-height:1.5}</style></head>
<body><main><h1>PHALANX · Recover Access</h1><p>Your candidates and permissions are preserved.</p>
<form id="requestForm"><label>Email<input id="recoveryEmail" type="email" autocomplete="username" required></label><button type="submit">Request Reset Link</button></form>
<form id="passwordForm" hidden><p>Choose your new password yourself. Enter it only on this page.</p><label>New Password<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label><label>Repeat New Password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Save New Password</button></form>
<p id="status" role="status" aria-live="polite">Open this page using your reset link to choose a new password.</p><p><a href="/">Back to Sign In</a></p>
<script type="module" src="./password-recovery.js"></script></main></body></html>
