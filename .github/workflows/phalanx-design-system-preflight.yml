name: PHALANX isolated design-system preflight
on:
  push:
    branches:
      - fix/battle-readiness-navigation-isolated-20261015
    paths:
      - 'deploy/phalanx-kvk-test/design-system-components-isolated.html'
      - 'deploy/phalanx-kvk-test/phalanx-components-isolated.css'
      - 'scripts/check_phalanx_design_system.py'
      - '.github/workflows/phalanx-design-system-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated design-system contract
        run: python3 scripts/check_phalanx_design_system.py
