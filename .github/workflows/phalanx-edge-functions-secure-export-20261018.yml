name: PHALANX Alpha Edge Export — SECURITY HOLD
# Deliberately disabled: repository visibility is PUBLIC and artifact download
# does not meet private encrypted independent-backup requirements.
# Never re-enable without approved private encrypted storage and broad secret review.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse unsafe export
        run: |
          echo "::error::SECURITY HOLD: public-repository artifacts are not approved for confidential Edge Function source."
          echo "No Supabase credentials accessed; no functions downloaded; no artifact uploaded."
          exit 1
