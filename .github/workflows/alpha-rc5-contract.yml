name: PHALANX isolated alpha RC5 contract
on:
  push:
    branches:
      - alpha/android-integrated-freeze-20261017
    paths:
      - 'preview/PHALANX_RC5_ALPHA_DERIVED_20261017.html'
      - 'tests/alpha/test_rc5_derived.py'
      - 'tests/alpha/test_harness_navigation.py'
      - '.github/workflows/alpha-rc5-contract.yml'
      - 'preview/phalanx-alpha-android-integration-20261017.html'
      - 'preview/phalanx-ranking-integration-rc-20261015.html'
      - 'preview/outpost-report-v11.html'
      - 'preview/outpost-map-alpha23-frozen.html'
      - 'preview/phalanx-rc5-isolated-route-adapter-20261017.js'
      - 'tests/alpha/test_outpost_v2_freeze_gate.py'
      - 'tests/alpha/test_version_lock.py'
      - 'tests/alpha/test_outpost_alpha24_canonical_lock.py'
      - 'data/outpost-map-alpha24-canonical-lock-20261018.json'
      - 'data/phalanx-alpha-version-lock-20261018.json'
      - 'data/phalanx-alpha-version-baseline-20261018.json'
      - 'tests/alpha/compare_version_locks.py'
      - 'tests/alpha/test_version_comparator.py'
      - 'preview/outpost-viewer-an-v1.js'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-rc5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm alpha derivative exists
        run: test -f preview/PHALANX_RC5_ALPHA_DERIVED_20261017.html
      - name: Verify archived Outpost Alpha23 reference before deployment
        run: python3 tests/alpha/test_outpost_v2_freeze_gate.py
      - name: Verify exact bytes and all 39 menu routes
        run: python3 tests/alpha/test_rc5_derived.py preview/PHALANX_RC5_ALPHA_DERIVED_20261017.html
      - name: Verify RC5 adapter and V2 routing contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js=Path('preview/phalanx-rc5-isolated-route-adapter-20261017.js').read_text()
          assert "['Outpost Map','outpost-map-alpha23-frozen.html']" in js
          assert "['Reports & History','outpost-report-v11.html']" in js
          assert "clone.setAttribute('href','./'+file)" in js
          html=Path('preview/phalanx-alpha-android-integration-20261017.html').read_text()
          assert "outposts:['./outpost-map-alpha23-frozen.html'" in html
          print('PASS: archived Alpha23 map and legacy report remain separate')
          PY
      - name: Enforce canonical approved Outpost Alpha24 identity
        run: python3 tests/alpha/test_outpost_alpha24_canonical_lock.py
      - name: Check version identity and visible legacy label
        run: python3 tests/alpha/test_version_lock.py
      - name: Regression test version comparison
        run: python3 tests/alpha/test_version_comparator.py
      - name: Generate deterministic version comparison
        run: python3 tests/alpha/compare_version_locks.py data/phalanx-alpha-version-baseline-20261018.json data/phalanx-alpha-version-lock-20261018.json alpha-version-diff.json
      - name: Verify alpha harness navigation contract
        run: python3 tests/alpha/test_harness_navigation.py
      - name: Verify all seven target modules and test harness
        shell: bash
        run: |
          test -f preview/phalanx-alpha-android-integration-20261017.html
          for file in \
            nexus-phalanx-command-center-alpha28-local-pair-test-2026-10-13.html \
            kvk-prep-five-contrast-v13.html \
            nexus-phalanx-battle-readiness-verified-status-test-2026-10-12.html \
            phalanx-ranking-integration-rc-20261015.html \
            outpost-map-alpha23-frozen.html \
            kingdom-hub-trends-v8.html \
            hero-intelligence-evidence-advisor-v15-2026-10-12.html; do
            test -s "preview/$file" || exit 1
          done
      - name: Verify Rankings back link stays inside deployed Alpha
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('preview/phalanx-ranking-integration-rc-20261015.html').read_text()
          assert 'href="./phalanx-alpha-android-integration-20261017.html#rc5" target="_top"' in source
          assert 'href="./phalanx-home-auth-rc9-20261014.html"' not in source
          PY
      - name: Verify archived Outpost Alpha23 file identity
        run: |
          python3 tests/alpha/test_outpost_v2_freeze_gate.py
          test -s preview/outpost-map-alpha23-frozen.html
      - name: Stage isolated Cloudflare Pages preview with legacy Outpost reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p alpha-deploy
          cp preview/PHALANX_RC5_ALPHA_DERIVED_20261017.html alpha-deploy/
          cp preview/phalanx-rc5-isolated-route-adapter-20261017.js alpha-deploy/
          cp preview/outpost-map-alpha23-frozen.html alpha-deploy/
          cp preview/outpost-report-v11.html alpha-deploy/
          cp preview/outpost-viewer-an-v1.js alpha-deploy/
          cp index.html alpha-deploy/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('alpha-deploy/PHALANX_RC5_ALPHA_DERIVED_20261017.html')
          source=p.read_text(encoding='utf-8')
          old='<a aria-disabled="true" data-pending="true" href="#">Outpost Map<small class="status unlinked">NOT LINKED</small></a>'
          new='<a href="./outpost-map-alpha23-frozen.html" title="Legacy Outpost Alpha23 - not current Alpha24">Outpost Map<small class="status linked">LEGACY 23</small></a>'
          assert source.count(old)==1, 'Outpost Map frozen anchor mismatch'
          source=source.replace(old,new)
          assert source.count('outpost-map-alpha23-frozen.html')==1
          script='<script src="./phalanx-rc5-isolated-route-adapter-20261017.js"></script>'
          assert source.count('./outpost-report-v11.html')==1, 'legacy report link must remain distinct'
          assert source.count('./outpost-map-alpha23-frozen.html')==1, 'legacy map must have one entry'
          assert source.count('</body>')==1
          source=source.replace('</body>',script+'</body>')
          p.write_text(source,encoding='utf-8')
          PY
          cp preview/phalanx-alpha-android-integration-20261017.html alpha-deploy/
          cp data/phalanx-alpha-version-lock-20261018.json alpha-deploy/
          cp alpha-version-diff.json alpha-deploy/
          test -s alpha-deploy/alpha-version-diff.json
          test -s alpha-deploy/phalanx-alpha-version-lock-20261018.json
          cp preview/nexus-phalanx-command-center-alpha28-local-pair-test-2026-10-13.html alpha-deploy/
          cp preview/kvk-prep-five-contrast-v13.html alpha-deploy/
          cp preview/kingdom-hub-scouting-v6.html alpha-deploy/
          cp nexus-app-2.webmanifest alpha-deploy/
          cp icon-192.png alpha-deploy/
          cp preview/nexus-phalanx-battle-readiness-verified-status-test-2026-10-12.html alpha-deploy/
          cp preview/phalanx-ranking-integration-rc-20261015.html alpha-deploy/
          cp preview/transfer-scouting-demo-v5.html alpha-deploy/
          cp preview/transfer-scouting-demo-v5.js alpha-deploy/
          cp preview/kingdom-hub-trends-v8.html alpha-deploy/
          cp preview/hero-intelligence-evidence-advisor-v15-2026-10-12.html alpha-deploy/
          # Preview HTML moves from /preview/ to the alpha-deploy root.
          # Correct relative PWA references only in deployed copies.
          python3 - <<'PY'
          from pathlib import Path
          for filename in (
              'nexus-phalanx-command-center-alpha28-local-pair-test-2026-10-13.html',
              'nexus-phalanx-battle-readiness-verified-status-test-2026-10-12.html',
          ):
              path = Path('alpha-deploy') / filename
              html = path.read_text(encoding='utf-8')
              assert '../nexus-app-2.webmanifest' in html
              assert '../icon-192.png' in html
              html = html.replace('../nexus-app-2.webmanifest', './nexus-app-2.webmanifest')
              html = html.replace('../icon-192.png', './icon-192.png')
              path.write_text(html, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          for name in ('nexus-phalanx-command-center-alpha28-local-pair-test-2026-10-13.html','nexus-phalanx-battle-readiness-verified-status-test-2026-10-12.html'):
              html=(Path('alpha-deploy')/name).read_text(encoding='utf-8')
              assert '../nexus-app-2.webmanifest' not in html and '../icon-192.png' not in html
              assert './nexus-app-2.webmanifest' in html and './icon-192.png' in html
          assert (Path('alpha-deploy')/'nexus-app-2.webmanifest').is_file()
          assert (Path('alpha-deploy')/'icon-192.png').is_file()
          PY
          test -s alpha-deploy/outpost-map-alpha23-frozen.html
          test -s alpha-deploy/phalanx-rc5-isolated-route-adapter-20261017.js
          grep -Fq "reports:['./outpost-report-v11.html'" alpha-deploy/phalanx-alpha-android-integration-20261017.html
          grep -Fq "['Outpost Map','outpost-map-alpha23-frozen.html']" alpha-deploy/phalanx-rc5-isolated-route-adapter-20261017.js
          python3 tests/alpha/test_outpost_v2_freeze_gate.py
      - name: Deploy verified alpha to isolated Cloudflare Pages
        if: ${{ github.ref == 'refs/heads/alpha/android-integrated-freeze-20261017' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::notice::Cloudflare credentials not configured; alpha deployment skipped."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy alpha-deploy --project-name=nexus-phalanx-rc5-test --branch=phalanx-alpha-rc5 --commit-dirty=true
      - name: Package isolated alpha for download (not production)
        uses: actions/upload-artifact@v4
        with:
          name: phalanx-rc5-alpha-20261018-n
          path: alpha-deploy/*
          retention-days: 7
