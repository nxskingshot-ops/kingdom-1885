name: PHALANX isolated alpha RC5 contract
on:
  push:
    branches:
      - alpha/android-integrated-freeze-20261017
    paths:
      - 'preview/PHALANX_RC5_ALPHA_DERIVED_20261017.html'
      - 'tests/alpha/test_rc5_derived.py'
      - 'tests/alpha/test_harness_navigation.py'
      - '.github/workflows/alpha-rc5-contract.yml'
      - 'preview/phalanx-alpha-android-integration-20261017.html'
      - 'preview/phalanx-ranking-integration-rc-20261015.html'
      - 'preview/outpost-report-v11.html'
      - 'preview/outpost-map-alpha23-frozen.html'
      - 'preview/phalanx-rc5-isolated-route-adapter-20261017.js'
      - 'tests/alpha/test_outpost_v2_freeze_gate.py'
      - 'preview/outpost-viewer-an-v1.js'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-rc5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm alpha derivative exists
        run: test -f preview/PHALANX_RC5_ALPHA_DERIVED_20261017.html
      - name: Gate approved Outpost V2 before any deployment\n        run: python3 tests/alpha/test_outpost_v2_freeze_gate.py\n      - name: Verify exact bytes and all 39 menu routes
        run: python3 tests/alpha/test_rc5_derived.py preview/PHALANX_RC5_ALPHA_DERIVED_20261017.html
      - name: Verify alpha harness navigation contract
        run: python3 tests/alpha/test_harness_navigation.py
      - name: Verify all seven target modules and test harness
        shell: bash
        run: |
          test -f preview/phalanx-alpha-android-integration-20261017.html
          for file in \
            nexus-phalanx-command-center-alpha28-local-pair-test-2026-10-13.html \
            kvk-prep-five-contrast-v13.html \
            nexus-phalanx-battle-readiness-verified-status-test-2026-10-12.html \
            phalanx-ranking-integration-rc-20261015.html \
            outpost-report-v11.html \
            kingdom-hub-trends-v8.html \
            hero-intelligence-evidence-advisor-v15-2026-10-12.html; do
            test -s "preview/$file" || exit 1
          done
      - name: Verify Rankings back link stays inside deployed Alpha
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('preview/phalanx-ranking-integration-rc-20261015.html').read_text()
          assert 'href="./phalanx-alpha-android-integration-20261017.html#rc5" target="_top"' in source
          assert 'href="./phalanx-home-auth-rc9-20261014.html"' not in source
          PY
      - name: Verify approved Outpost Map V2 identity
        run: |
          python3 tests/alpha/test_outpost_v2_freeze_gate.py
          test -s preview/outpost-map-alpha23-frozen.html
      - name: Stage flat Cloudflare Pages preview with approved Outpost V2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p alpha-deploy
          cp preview/PHALANX_RC5_ALPHA_DERIVED_20261017.html alpha-deploy/
          cp preview/phalanx-rc5-isolated-route-adapter-20261017.js alpha-deploy/
          cp preview/outpost-map-alpha23-frozen.html alpha-deploy/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('alpha-deploy/PHALANX_RC5_ALPHA_DERIVED_20261017.html')
          source=p.read_text(encoding='utf-8')
          old='<a aria-disabled="true" data-pending="true" href="#">Outpost Map<small class="status unlinked">NOT LINKED</small></a>'
          new='<a href="./outpost-map-alpha23-frozen.html" title="Freigegebene Outpost Map V2 Alpha23">Outpost Map<small class="status linked">PREVIEW</small></a>'
          assert source.count(old)==1, 'Outpost Map frozen anchor mismatch'
          source=source.replace(old,new)
          assert source.count('outpost-map-alpha23-frozen.html')==1
          p.write_text(source,encoding='utf-8')
          PY
          cp preview/phalanx-alpha-android-integration-20261017.html alpha-deploy/
          cp preview/nexus-phalanx-command-center-alpha28-local-pair-test-2026-10-13.html alpha-deploy/
          cp preview/kvk-prep-five-contrast-v13.html alpha-deploy/
          cp preview/nexus-phalanx-battle-readiness-verified-status-test-2026-10-12.html alpha-deploy/
          cp preview/phalanx-ranking-integration-rc-20261015.html alpha-deploy/
          cp preview/transfer-scouting-demo-v5.html alpha-deploy/
          cp preview/transfer-scouting-demo-v5.js alpha-deploy/
          cp preview/kingdom-hub-trends-v8.html alpha-deploy/
          cp preview/hero-intelligence-evidence-advisor-v15-2026-10-12.html alpha-deploy/
          test -s alpha-deploy/outpost-map-alpha23-frozen.html
          test -s alpha-deploy/phalanx-rc5-isolated-route-adapter-20261017.js
          ! grep -q 'outpost-report-v11.html' alpha-deploy/phalanx-alpha-android-integration-20261017.html
          ! grep -q 'outpost-report-v11.html' alpha-deploy/phalanx-rc5-isolated-route-adapter-20261017.js
          python3 tests/alpha/test_outpost_v2_freeze_gate.py
      - name: Deploy verified alpha to isolated Cloudflare Pages
        if: ${{ github.ref == 'refs/heads/alpha/android-integrated-freeze-20261017' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::notice::Cloudflare credentials not configured; alpha deployment skipped."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy alpha-deploy --project-name=nexus-phalanx-rc5-test --branch=phalanx-alpha-rc5 --commit-dirty=true
      - name: Package isolated alpha for download (not production)
        uses: actions/upload-artifact@v4
        with:
          name: phalanx-rc5-alpha-20261018-n
          path: alpha-deploy/*
          retention-days: 7
