name: PHALANX isolated Android debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - work/phx-android-capacitor-isolated-20261115
    paths:
      - 'android-stage/www/**'
      - 'android-stage/package.json'
      - 'android-stage/capacitor.config.json'
      - '.github/workflows/phx-android-isolated-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    if: github.ref == 'refs/heads/work/phx-android-capacitor-isolated-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-stage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK with command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify original assets
        run: node scripts/verify.cjs
      - name: Generate lockfile from pinned versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Create Android native project
        run: npx cap add android && npx cap sync android
      - name: Apply Android edge-to-edge window inset fix (isolated build only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/res/values/styles.xml')
          s=p.read_text()
          # Android 15 target SDK 35: opt out of forced edge-to-edge for the test build.
          if 'android:windowOptOutEdgeToEdgeEnforcement' not in s:
              s=s.replace('</style>', '<item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>\n    </style>')
          p.write_text(s)
          main=next(Path('android/app/src/main/java').rglob('MainActivity.java'))
          src=main.read_text()
          if 'WindowCompat.setDecorFitsSystemWindows' not in src:
              src=src.replace('public class MainActivity extends BridgeActivity {', '''public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(android.os.Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              androidx.core.view.WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
              getWindow().setStatusBarColor(android.graphics.Color.rgb(8, 15, 28));
              getWindow().setNavigationBarColor(android.graphics.Color.rgb(8, 15, 28));
            }
          ''')
          main.write_text(src)
          print('Applied native Android window fit and edge-to-edge opt-out to generated project')
          PY
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phalanx-stage-lockfile
          path: android-stage/package-lock.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: phalanx-stage-debug-apk
          path: android-stage/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
