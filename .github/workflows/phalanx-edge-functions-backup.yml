name: PHALANX Edge Function Source Backup — SECURITY HOLD
# Public repository: do not commit confidential deployed source here.
# The former implementation downloaded and pushed sources into this repository.
# Retained as a disabled manual entrypoint until a private encrypted backup is approved.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse unsafe public source commit
        run: |
          echo "::error::SECURITY HOLD: do not commit deployed Edge Function source to a public repository."
          echo "No Supabase access, no source export and no git push performed."
          exit 1
