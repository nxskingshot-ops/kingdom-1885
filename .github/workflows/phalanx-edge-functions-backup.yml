name: PHALANX Edge Function backup safety gate
# Safe replacement: no deployed source download, no commit, no upload.
# This is NOT a completed backup. Release requires a separately reviewed encrypted exporter.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-safety-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate recorded inventory and fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/phalanx-edge-functions-backup-inventory.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          funcs = data["functions"]
          slugs = [f["slug"] for f in funcs]
          assert data["count"] == len(funcs) == 26, "Expected 26 inventory entries"
          assert len(set(slugs)) == 26, "Duplicate function slug"
          assert all(f["status"] == "ACTIVE" and isinstance(f["version"], int) and len(f["ezbr_sha256"]) == 64 for f in funcs), "Invalid function metadata"
          assert data["source_parity"] == "NOT_VERIFIED", "Unexpected source-parity assertion"
          print("Recorded inventory schema valid: 26 entries.")
          print("This validates historical metadata only, NOT live source parity or recovery.")
          PY
      - name: Block unsafe export pending encrypted offsite implementation
        shell: bash
        run: |
          echo "::error::BACKUP BLOCKED: encrypted private offsite export, secret scanning and isolated restore validation are not implemented in this workflow."
          exit 1
