# PHX-SEC-037: fail-closed until private backup is implemented.
# This intentionally does not retrieve, upload, commit or expose Edge Function source.
name: PHALANX Edge Function source backup (safety hold)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Block unreviewed source publication
        shell: bash
        run: |
          echo "::error::PHX-SEC-037 safety hold: private encrypted archival and secret scanning are not yet verified."
          exit 1
