name: PHALANX modifier regression v1
on:
  push:
    paths:
      - 'src/phalanx-modifier-math-v1.js'
      - 'tests/phalanx-modifier-math-v1.test.js'
      - '.github/workflows/phalanx-modifier-regression-v1.yml'
  workflow_dispatch:
jobs:
  modifier-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression scenarios
        run: node tests/phalanx-modifier-math-v1.test.js
