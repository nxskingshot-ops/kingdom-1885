name: PHALANX Battle Readiness isolated Cloudflare preview

on:
  push:
    branches:
      - fix/battle-readiness-navigation-isolated-20261015
    paths:
      - '.github/workflows/phalanx-battle-readiness-preview.yml'
      - 'deploy/phalanx-kvk-test/battle-readiness-isolated.html'
      - 'deploy/phalanx-kvk-test/crimson-icon-test.html'
      - 'deploy/phalanx-kvk-test/crimson-icon-test.webmanifest'
      - 'deploy/phalanx-kvk-test/assets/crimson-icon-*.png'
      - 'scripts/check_phalanx_test_assets.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phalanx-battle-readiness-isolated-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v4
      - name: Validate test assets before preview
        run: python3 scripts/check_phalanx_test_assets.py
      - name: Deploy Cloudflare branch preview (not production alias)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy/phalanx-kvk-test --project-name=nexus-phalanx-kvk-test --branch=fix-battle-readiness-isolated-20261015
