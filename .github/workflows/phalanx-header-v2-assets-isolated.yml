name: PHALANX Header V2 Asset Gate (isolated)
on:
  workflow_dispatch:
  push:
    branches:
      - fix/battle-readiness-navigation-isolated-20261015
    paths:
      - 'assets/header-v2/**'
      - 'scripts/verify_phalanx_header_v2_assets.py'
      - 'scripts/check_phalanx_header_v2_contract.py'
      - 'scripts/check_phalanx_header_v2_workflow.py'
      - 'src/phalanx-unified-header-v2-isolated.js'
      - 'src/phalanx-unified-header-v2-isolated.css'
      - 'deploy/phalanx-kvk-test/header-v2-isolated.html'
      - '.github/workflows/phalanx-header-v2-assets-isolated.yml'
jobs:
  asset-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved original and crops
        run: python3 scripts/verify_phalanx_header_v2_assets.py
      - name: Verify isolated component contract
        run: python3 scripts/check_phalanx_header_v2_contract.py
      - name: Verify workflow stays isolated and read-only
        run: python3 scripts/check_phalanx_header_v2_workflow.py
