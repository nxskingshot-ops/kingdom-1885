name: PHALANX HOME FINAL verification
on:
  push:
    branches:
      - work/phx-home-final-audit-20261116
      - work/phx-home-plaque-validation-20261120
    paths:
      - '.github/workflows/phx-home-final-browser.yml'
      - 'android-stage/**'
      - 'integration/war-room-live-profile/**'
      - 'deploy/phalanx-kvk-test/pylon-ix/transfer-*/**'
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/work/phx-home-final-audit-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify protected source and profile handler
        run: |
          (cd android-stage && node scripts/verify.cjs)
          node --test integration/war-room-live-profile/handler.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --prefix /tmp/phx-browser @playwright/test@1.58.2
          /tmp/phx-browser/node_modules/.bin/playwright install chromium
      - name: Verify the web assets packaged by Android
        run: |
          cp -a android-stage/www /tmp/phx-home-final-www
          python3 android-stage/scripts/integrate-home-v25.py /tmp/phx-home-final-www
          python3 android-stage/scripts/integrate-war-room-live-v28.py /tmp/phx-home-final-www
          python3 android-stage/scripts/integrate-outpost-exports.py /tmp/phx-home-final-www
          node android-stage/scripts/phx-war-academy-core-v01.test.cjs
          python3 android-stage/scripts/integrate-war-academy.py /tmp/phx-home-final-www
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/phx-home-final-www &
          for attempt in {1..10}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/; then break; fi
            sleep 1
          done
          PHX_TEST_LIVE_PROFILE=1 PHX_TEST_WAR_ACADEMY=1 PHX_EVIDENCE=/tmp/phx-home-final-evidence \
            NODE_PATH=/tmp/phx-browser/node_modules node android-stage/scripts/test-home-v25.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phalanx-home-final-browser-evidence
          path: /tmp/phx-home-final-evidence
          retention-days: 7
  android-emulator:
    needs: browser
    if: ${{ !cancelled() && (needs.browser.result == 'success' || needs.browser.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-stage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
      - name: Verify frozen app and War Room layer
        run: |
          node scripts/verify.cjs
          node --check www/phx-war-room-v2.js
          node --check www/phx-war-room-live.js
          echo "184d4632637057086989360e21b0663a7e47ac4bb2e186b16ff29f08a6991630  www/phx-war-room-reference.jpg" | sha256sum -c
      - name: Generate isolated Android project
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          node - <<'JS'
          const fs = require('node:fs');
          const file = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.appId = 'app.nexusphalanx.stage.homefinal';
          config.appName = 'NEXUS PHALANX HOME FINAL TEST';
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          JS
          npx cap add android
          npx cap sync android
      - name: Fix Android system status bar overlap in generated native project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          styles=Path('android/app/src/main/res/values/styles.xml')
          source=styles.read_text()
          if 'android:windowOptOutEdgeToEdgeEnforcement' not in source:
              source=source.replace('</style>','<item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>\n    </style>')
          styles.write_text(source)
          main=next(Path('android/app/src/main/java').rglob('MainActivity.java'))
          code=main.read_text()
          needle='public class MainActivity extends BridgeActivity {'
          assert code.count(needle)==1,'Unexpected MainActivity structure; stop'
          assert 'WindowCompat.setDecorFitsSystemWindows' not in code,'Fix already applied; stop'
          main.with_name('OutpostExportPlugin.java').write_bytes(Path('native/OutpostExportPlugin.java').read_bytes())
          code=code.replace(needle,needle+'''
            @Override
            public void onCreate(android.os.Bundle savedInstanceState) {
              registerPlugin(OutpostExportPlugin.class);
              super.onCreate(savedInstanceState);
              android.webkit.WebView.setWebContentsDebuggingEnabled(true);
              androidx.core.view.WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
              getWindow().setStatusBarColor(android.graphics.Color.rgb(8, 15, 28));
              getWindow().setNavigationBarColor(android.graphics.Color.rgb(8, 15, 28));
              getOnBackPressedDispatcher().addCallback(this, new androidx.activity.OnBackPressedCallback(true) {
                @Override
                public void handleOnBackPressed() {
                  android.webkit.WebView webView = getBridge().getWebView();
                  String route = android.net.Uri.parse(webView.getUrl() == null ? "" : webView.getUrl()).getFragment();
                  if ("transfer".equals(route)) {
                    webView.evaluateJavascript("window.phxBackFromTransfer()", null);
                    return;
                  }
                  if ("pylon".equals(route) && webView.canGoBack()) {
                    webView.goBack();
                    return;
                  }
                  setEnabled(false);
                  try {
                    getOnBackPressedDispatcher().onBackPressed();
                  } finally {
                    setEnabled(true);
                  }
                }
              });
            }
          ''')
          main.write_text(code)
          assert 'WindowCompat.setDecorFitsSystemWindows(getWindow(), true)' in main.read_text()
          assert 'android:windowOptOutEdgeToEdgeEnforcement' in styles.read_text()
          print('PASS: Android status/navigation bar inset patch applied to generated native test app')
          PY
      - name: Adapt original HOME plaque in generated Android assets
        run: |
          python3 scripts/integrate-home-v25.py android/app/src/main/assets/public
          python3 scripts/integrate-war-room-live-v28.py android/app/src/main/assets/public
          python3 scripts/integrate-outpost-exports.py android/app/src/main/assets/public
          python3 scripts/integrate-war-academy.py android/app/src/main/assets/public
      - name: Build independent debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Prepare Android emulator checks
        working-directory: .
        run: |
          npm install --no-save --prefix /tmp/phx-browser @playwright/test@1.58.2
          sudo chown "$USER" /dev/kvm
      - name: Install and verify the app in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: PHX_UNIFIED_PLAQUE='${{ github.ref == 'refs/heads/work/phx-home-plaque-validation-20261120' }}' bash android-stage/scripts/test-home-final-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phalanx-home-final-android-emulator-evidence
          path: /tmp/phx-home-final-android
          retention-days: 7
