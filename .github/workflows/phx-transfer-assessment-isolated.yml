name: PHX Transfer Assessment isolated checks
on:
  push:
    branches:
      - test/transfer-assessment-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check preview/transfer-assessment-20261103.js
          node --check preview/transfer-scouting-id-stage-20261030.js
      - name: Assessment unit tests
        run: node --test tests/transfer-assessment-20261103.test.mjs
