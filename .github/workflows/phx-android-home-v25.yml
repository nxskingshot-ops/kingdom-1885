name: PHALANX V2.6 isolated HOME Android APK
on:
  push:
    branches:
      - work/phx-android-home-v25-20261116
      - work/phx-home-v26-android-css-20261116
    paths:
      - '.github/workflows/phx-android-home-v25.yml'
      - 'android-stage/**'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-stage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify frozen app and War Room layer
        run: |
          node scripts/verify.cjs
          node --check www/phx-war-room-v2.js
      - name: Generate isolated Android project
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          node - <<'JS'
          const fs = require('node:fs');
          const file = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.appId = 'app.nexusphalanx.stage.v26plaque';
          config.appName = 'NEXUS PHALANX V2.6 TEST';
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          JS
          npx cap add android
          npx cap sync android
      - name: Fix Android system status bar overlap in generated native project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          styles=Path('android/app/src/main/res/values/styles.xml')
          source=styles.read_text()
          if 'android:windowOptOutEdgeToEdgeEnforcement' not in source:
              source=source.replace('</style>','<item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>\n    </style>')
          styles.write_text(source)
          main=next(Path('android/app/src/main/java').rglob('MainActivity.java'))
          code=main.read_text()
          needle='public class MainActivity extends BridgeActivity {'
          assert code.count(needle)==1,'Unexpected MainActivity structure; stop'
          assert 'WindowCompat.setDecorFitsSystemWindows' not in code,'Fix already applied; stop'
          code=code.replace(needle,needle+'''
            @Override
            public void onCreate(android.os.Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              androidx.core.view.WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
              getWindow().setStatusBarColor(android.graphics.Color.rgb(8, 15, 28));
              getWindow().setNavigationBarColor(android.graphics.Color.rgb(8, 15, 28));
            }
          ''')
          main.write_text(code)
          assert 'WindowCompat.setDecorFitsSystemWindows(getWindow(), true)' in main.read_text()
          assert 'android:windowOptOutEdgeToEdgeEnforcement' in styles.read_text()
          print('PASS: Android status/navigation bar inset patch applied to generated native test app')
          PY
      - name: Adapt original HOME plaque in generated Android assets
        run: python3 scripts/integrate-home-v25.py android/app/src/main/assets/public
      - name: Build independent debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Verify package, certificate and APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n1)"
          SIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" > /tmp/package.txt
          grep -q "name='app.nexusphalanx.stage.v26plaque'" /tmp/package.txt
          "$SIGNER" verify --print-certs "$APK" | tee /tmp/apk-signature.txt
          grep -qi "certificate SHA-256 digest" /tmp/apk-signature.txt
          test -s "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: phalanx-home-v26-android-apk
          path: android-stage/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save --prefix /tmp/phx-browser @playwright/test@1.58.2
          /tmp/phx-browser/node_modules/.bin/playwright install chromium
      - name: Test generated HOME and existing modules in a mobile browser
        run: |
          cp -a android-stage/www /tmp/phx-v25-www
          python3 android-stage/scripts/integrate-home-v25.py /tmp/phx-v25-www
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/phx-v25-www &
          for attempt in {1..10}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/; then break; fi
            sleep 1
          done
          NODE_PATH=/tmp/phx-browser/node_modules node android-stage/scripts/test-home-v25.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phalanx-home-v25-browser-evidence
          path: /tmp/phx-v25-evidence
          retention-days: 7
