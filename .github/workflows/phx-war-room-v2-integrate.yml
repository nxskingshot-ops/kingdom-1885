name: PHALANX War Room V2 isolated integration patch
on:
  push:
    branches:
      - work/phx-android-v21-parallel-20261115
    paths:
      - 'android-stage/scripts/integrate-war-room-v2.py'
      - '.github/workflows/phx-war-room-v2-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/work/phx-android-v21-parallel-20261115'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify frozen original before additive integration
        run: node android-stage/scripts/verify.cjs
      - name: Apply guarded isolated integration
        run: python3 android-stage/scripts/integrate-war-room-v2.py
      - name: Verify all frozen assets and navigation markers after integration
        run: node android-stage/scripts/verify.cjs
      - name: Verify War Room V2 scripts exist
        run: |
          test -s android-stage/www/phx-war-room-v2.js
          test -s android-stage/www/phx-war-room-v2.css
          node --check android-stage/www/phx-war-room-v2.js
      - name: Commit isolated app integration
        run: |
          git config user.name "phalanx-war-room-bot"
          git config user.email "phalanx-war-room-bot@users.noreply.github.com"
          git add android-stage/www/index.html android-stage/checksums.json
          git diff --cached --quiet && exit 0
          git commit -m "feat(war-room): integrate scoped V2 dossier into isolated Android test app"
          git push origin HEAD:work/phx-android-v21-parallel-20261115
