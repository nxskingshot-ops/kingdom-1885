name: PHALANX Effect Bridge Regression
on:
  push:
    branches: [main]
    paths:
      - 'tests/phalanx-effect-model-bridge-v1.test.cjs'
      - 'data/phalanx-effect-model-bridge-v1-2026-10-13.json'
      - 'data/phalanx-skill-effect-taxonomy-v1-2026-10-13.json'
      - '.github/workflows/phalanx-effect-bridge-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check skill effect model bridge
        run: node tests/phalanx-effect-model-bridge-v1.test.cjs
