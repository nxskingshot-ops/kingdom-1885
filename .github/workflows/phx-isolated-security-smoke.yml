name: PHALANX isolated security smoke tests
on:
  workflow_dispatch:
  push:
    branches:
      - test/phx-security-e2e-20261103
permissions:
  contents: read
jobs:
  isolated-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PHX_TEST_URL: https://yuyvmbdybwpwpqsipfjt.supabase.co/functions/v1/nexus-access-review
    steps:
      - name: Verify isolated project and no credentials in logs
        shell: bash
        run: |
          test "$PHX_TEST_URL" = "https://yuyvmbdybwpwpqsipfjt.supabase.co/functions/v1/nexus-access-review"
      - name: Verify unauthenticated requests are rejected
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 --output /tmp/phx-response --write-out '%{http_code}' -X POST "$PHX_TEST_URL" -H 'Content-Type: application/json' --data '{"action":"reset","id":990011}')
          if [[ "$status" != "401" && "$status" != "403" ]]; then
            echo "FAIL: unauthenticated request returned HTTP $status"
            exit 1
          fi
          echo "PASS: unauthenticated reset denied (HTTP $status)"
      - name: Verify invalid bearer is rejected
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 --output /tmp/phx-response --write-out '%{http_code}' -X POST "$PHX_TEST_URL" -H 'Content-Type: application/json' -H 'Authorization: Bearer invalid.synthetic.jwt' --data '{"action":"approve","id":990011}')
          if [[ "$status" != "401" && "$status" != "403" ]]; then
            echo "FAIL: invalid JWT returned HTTP $status"
            exit 1
          fi
          echo "PASS: invalid bearer denied (HTTP $status)"
      - name: Verify all sensitive actions reject missing or invalid JWT
        shell: bash
        run: |
          set -euo pipefail
          for action in approve reject reset; do
            for credential in missing invalid; do
              args=(-H 'Content-Type: application/json')
              if [[ "$credential" == invalid ]]; then
                args+=(-H 'Authorization: Bearer invalid.synthetic.jwt')
              fi
              status=$(curl --silent --show-error --max-time 20 --output /tmp/phx-response --write-out '%{http_code}' -X POST "$PHX_TEST_URL" "${args[@]}" --data "{\"action\":\"$action\",\"id\":990011}")
              if [[ "$status" != 401 && "$status" != 403 ]]; then
                echo "FAIL: $action with $credential credentials returned HTTP $status"
                exit 1
              fi
              echo "PASS: $action with $credential credentials denied (HTTP $status)"
            done
          done
      - name: Verify cross-origin preflight does not authorize mutation
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 --output /tmp/phx-response --write-out '%{http_code}' -X POST "$PHX_TEST_URL" -H 'Origin: https://unauthorized.example' -H 'Content-Type: application/json' --data '{"action":"reset","id":990011}')
          if [[ "$status" != 401 && "$status" != 403 ]]; then
            echo "FAIL: unauthorized origin reset returned HTTP $status"
            exit 1
          fi
          echo "PASS: unauthorized origin reset denied (HTTP $status)"
      - name: Report remaining coverage
        run: |
          echo "NOT TESTED: authenticated officer approval/rejection, account creation, reset, GOD rights, transactional failure recovery."
          echo "This workflow intentionally does not create or modify any Auth users, production data or credentials."
