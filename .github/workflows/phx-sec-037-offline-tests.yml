name: PHX-SEC-037 Offline Security Tests
on:
  pull_request:
    paths:
      - 'scripts/phx-sec-037-verify-backup.py'
      - 'tests/test_phx_sec_037_verify_backup.py'
      - '.github/workflows/phx-sec-037-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic offline preflight tests
        run: python3 -m unittest discover -s tests -p 'test_phx_sec_037_verify_backup.py' -v
