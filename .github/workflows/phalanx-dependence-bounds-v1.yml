name: PHALANX dependence bounds
on:
  push:
    paths:
      - 'src/phalanx-dependence-bounds-v1.js'
      - 'tests/phalanx-dependence-bounds-v1.test.js'
      - '.github/workflows/phalanx-dependence-bounds-v1.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/phalanx-dependence-bounds-v1.test.js
