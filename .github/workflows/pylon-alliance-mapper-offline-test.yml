name: PYLON IX isolated alliance mapper tests
on:
  workflow_dispatch:
  push:
    branches:
      - feature/pylon-ix-design-spec-20261017
    paths:
      - integration/pylon-alliance-preview.mjs
      - integration/pylon-alliance-ui-adapter.mjs
      - integration/pylon-alliance-host.mjs
      - preview/outpost-editor.js
      - preview/outpost-editor.html
      - integration/pylon-alliance-isolated-preview.html
      - integration/pylon-alliance-preview-test.mjs
      - integration/pylon-context-presenter.mjs
      - integration/pylon-alliance-context-mapper.mjs
      - integration/pylon-alliance-context-mapper-test.mjs
      - integration/pylon-alliance-readonly-bridge.mjs
      - integration/pylon-alliance-readonly-bridge-test.mjs
      - integration/pylon-alliance-rls-role-check.mjs
      - integration/pylon-alliance-rls-role-check-test.mjs
      - integration/pylon-alliance-rls-verdict.mjs
      - integration/pylon-alliance-rls-verdict-test.mjs
      - integration/alliance-overview-reader-test.mjs
      - integration/alliance-overview-reader-offline-test.mjs
      - integration/alliance-top40-reader-test.mjs
      - integration/alliance-top40-reader-offline-test.mjs
      - .github/workflows/pylon-alliance-mapper-offline-test.yml
permissions:
  contents: read
jobs:
  offline-mapper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check isolated PHALANX modules
        run: |
          for file in integration/pylon-alliance-*.mjs integration/alliance-*-reader*.mjs; do
            node --check "$file"
          done
      - name: Check PYLON integration entrypoints
        run: |
          node --check integration/pylon-alliance-host.mjs
          node --check preview/outpost-editor.js
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const isolated = readFileSync('integration/pylon-alliance-isolated-preview.html', 'utf8');
          const editor = readFileSync('preview/outpost-editor.html', 'utf8');
          const script = readFileSync('preview/outpost-editor.js', 'utf8');
          if (!isolated.includes("from './pylon-alliance-host.mjs'")) process.exit(1);
          if (!editor.includes('id="pylon-ix-panel"')) process.exit(1);
          if (!script.includes("import('../integration/pylon-alliance-host.mjs')")) process.exit(1);
          NODE
      - name: Run mock-only PYLON mapper tests
        run: |
          node integration/pylon-alliance-preview-test.mjs
          node integration/pylon-alliance-context-mapper-test.mjs
          node integration/pylon-alliance-readonly-bridge-test.mjs
          node integration/pylon-alliance-rls-role-check-test.mjs
          node integration/pylon-alliance-rls-verdict-test.mjs
          node integration/alliance-overview-reader-offline-test.mjs
          node integration/alliance-top40-reader-offline-test.mjs
