name: PHALANX isolated Cloudflare Pages test deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phalanx-cloudflare-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Validate test-only files and secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -s deploy/phalanx-kvk-test/index.html || { echo "Missing reviewed test index.html; refusing deploy"; exit 1; }
          test -s deploy/phalanx-kvk-test/index-kvk.html || { echo "Missing reviewed test index-kvk.html; refusing deploy"; exit 1; }
          test -s deploy/phalanx-kvk-test/kvk-prep-v13.html || { echo "Missing reviewed test kvk-prep-v13.html; refusing deploy"; exit 1; }
      - name: Verify PYLON standalone test asset
        run: |
          test -s deploy/phalanx-kvk-test/pylon-ix-standalone-offline.html || { echo "Missing PYLON standalone file"; exit 1; }
          grep -q 'id="ask-form"' deploy/phalanx-kvk-test/pylon-ix-standalone-offline.html || { echo "Missing PYLON question form"; exit 1; }
      - name: Run isolated test asset preflight
        run: python3 scripts/check_phalanx_test_assets.py
      - name: Stage authenticated PHALANX editor with PYLON modules
        run: |
          set -eu
          mkdir -p deploy/phalanx-kvk-test/preview deploy/phalanx-kvk-test/integration
          cp preview/outpost-editor.html preview/outpost-editor.js deploy/phalanx-kvk-test/preview/
          cp integration/pylon-alliance-*.mjs integration/pylon-context-presenter.mjs integration/alliance-overview-reader-test.mjs deploy/phalanx-kvk-test/integration/
          test -s deploy/phalanx-kvk-test/preview/outpost-editor.html
          test -s deploy/phalanx-kvk-test/integration/pylon-alliance-host.mjs
      - name: Deploy isolated test directory only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy/phalanx-kvk-test --project-name=nexus-phalanx-kvk-test --branch=phalanx-cloudflare-test-deploy
