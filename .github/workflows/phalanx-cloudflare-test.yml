name: PHALANX isolated Cloudflare Pages test deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phalanx-cloudflare-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/phalanx-cloudflare-test-deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
        with:
          ref: phalanx-cloudflare-test-deploy
      - name: Validate test-only files and secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -s deploy/phalanx-kvk-test/index.html || { echo "Missing reviewed test index.html; refusing deploy"; exit 1; }
          test -s deploy/phalanx-kvk-test/index-kvk.html || { echo "Missing reviewed test index-kvk.html; refusing deploy"; exit 1; }
          test -s deploy/phalanx-kvk-test/kvk-prep-v13.html || { echo "Missing reviewed test kvk-prep-v13.html; refusing deploy"; exit 1; }
      - name: Deploy isolated test directory only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy/phalanx-kvk-test --project-name=nexus-phalanx-kvk-test --branch=phalanx-cloudflare-test-deploy
