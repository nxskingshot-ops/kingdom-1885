name: PHALANX V2 APK signature diagnosis
on:
  push:
    branches:
      - work/phx-android-capacitor-isolated-20261115
    paths:
      - '.github/workflows/phx-android-signature-diagnose.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare-existing-artifacts:
    if: github.ref == 'refs/heads/work/phx-android-capacitor-isolated-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Compare APK signatures and manifest metadata from builds 4, 5, 6 and 7
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phx-apk-compare
          python3 - <<'PY'
          import json, os, subprocess
          repo=os.environ["GH_REPO"]
          raw=subprocess.check_output(["gh","run","list","--repo",repo,"--workflow","phx-android-isolated-debug.yml","--branch","work/phx-android-capacitor-isolated-20261115","--limit","30","--json","databaseId,number,conclusion"],text=True)
          runs=json.loads(raw)
          for number in (4,5,6,7):
              matches=[r for r in runs if r["number"]==number and r["conclusion"]=="success"]
              if not matches: raise SystemExit(f"Cannot find successful build #{number}; stop without guessing")
              runid=str(matches[0]["databaseId"])
              target=f"/tmp/phx-apk-compare/build-{number}"
              os.makedirs(target,exist_ok=True)
              subprocess.run(["gh","run","download",runid,"--repo",repo,"--name","phalanx-stage-debug-apk","--dir",target],check=True)
              print(f"Downloaded existing APK artifact from build #{number}")
          PY
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          for number in 4 5 6 7; do
            apk="/tmp/phx-apk-compare/build-$number/app-debug.apk"
            test -s "$apk"
            echo "=== BUILD #$number ==="
            sha256sum "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E 'Signer #1 certificate SHA-256 digest|Verified using v[1234] scheme' || true
            "$AAPT" dump badging "$apk" | grep -m1 "^package:"
          done
          cert4="$("$APKSIGNER" verify --print-certs /tmp/phx-apk-compare/build-4/app-debug.apk | sed -nE 's/.*Signer #1 certificate SHA-256 digest: *([[:xdigit:]]{64}).*/\1/p' | head -n1)"
          cert5="$("$APKSIGNER" verify --print-certs /tmp/phx-apk-compare/build-5/app-debug.apk | sed -nE 's/.*Signer #1 certificate SHA-256 digest: *([[:xdigit:]]{64}).*/\1/p' | head -n1)"
          cert6="$("$APKSIGNER" verify --print-certs /tmp/phx-apk-compare/build-6/app-debug.apk | sed -nE 's/.*Signer #1 certificate SHA-256 digest: *([[:xdigit:]]{64}).*/\1/p' | head -n1)"
          test -n "$cert4" && test -n "$cert5" && test -n "$cert6"
          if [[ "$cert4" == "$cert6" ]]; then echo "RESULT: SAME signing certificate for build #4 and #6."; else echo "RESULT: DIFFERENT signing certificates for build #4 and #6; direct update incompatible."; fi
          if [[ "$cert5" == "$cert6" ]]; then
            echo "RESULT: SAME signing certificate for build #4, #5 and #6."
          else
            echo "RESULT: DIFFERENT signing certificates for build #4, #5 and #6; Android cannot update one with the other."
          fi
          phone_cert="bab2610df631cd2616bc5eb2fbbd7c06f51b69e7f8fff873b9474bf4446c1780"
          echo "INSTALLED V2 CERT SHA256: $phone_cert"
          for number in 4 5 6 7; do
            apk="/tmp/phx-apk-compare/build-$number/app-debug.apk"
            cert="$("$APKSIGNER" verify --print-certs "$apk" | sed -nE 's/.*Signer #1 certificate SHA-256 digest: *([[:xdigit:]]{64}).*/\1/p' | head -n1)"
            cert="$(echo "$cert" | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$cert" =~ ^[0-9a-f]{64}$ ]]; then
              echo "ERROR: No valid signing fingerprint extracted for build #$number"
              "$APKSIGNER" verify --print-certs "$apk"
              exit 1
            fi
            echo "BUILD #$number CERT SHA256: $cert"
            if [[ "$cert" == "$phone_cert" ]]; then
              echo "BUILD #$number vs INSTALLED V2: MATCH"
            else
              echo "BUILD #$number vs INSTALLED V2: MISMATCH"
            fi
          done
          echo "This compares user-supplied installed-app fingerprint to GitHub artifacts; not an install test."
