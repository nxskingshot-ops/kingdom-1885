name: PHALANX V2.4 safe side-by-side install APK
on:
  push:
    branches:
      - work/phx-android-v21-parallel-20261115
    paths:
      - '.github/workflows/phx-android-v24-plaque-fixed.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-stage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify frozen app and War Room layer
        run: |
          node scripts/verify.cjs
          node --check www/phx-war-room-v2.js
      - name: Generate isolated Android project
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npx cap add android && npx cap sync android
      - name: Fix Android system status bar overlap in generated native project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          styles=Path('android/app/src/main/res/values/styles.xml')
          source=styles.read_text()
          if 'android:windowOptOutEdgeToEdgeEnforcement' not in source:
              source=source.replace('</style>','<item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>\n    </style>')
          styles.write_text(source)
          main=next(Path('android/app/src/main/java').rglob('MainActivity.java'))
          code=main.read_text()
          needle='public class MainActivity extends BridgeActivity {'
          assert code.count(needle)==1,'Unexpected MainActivity structure; stop'
          assert 'WindowCompat.setDecorFitsSystemWindows' not in code,'Fix already applied; stop'
          code=code.replace(needle,needle+'''
            @Override
            public void onCreate(android.os.Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              androidx.core.view.WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
              getWindow().setStatusBarColor(android.graphics.Color.rgb(8, 15, 28));
              getWindow().setNavigationBarColor(android.graphics.Color.rgb(8, 15, 28));
            }
          ''')
          main.write_text(code)
          assert 'WindowCompat.setDecorFitsSystemWindows(getWindow(), true)' in main.read_text()
          assert 'android:windowOptOutEdgeToEdgeEnforcement' in styles.read_text()
          print('PASS: Android status/navigation bar inset patch applied to generated native test app')
          PY
      - name: Change only generated test package identity, not source or data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          old='applicationId "app.nexusphalanx.stage.v21parallel"'
          assert s.count(old)==1,'Unexpected package; stop'
          s=s.replace(old,'applicationId "app.nexusphalanx.stage.v24plaque"')
          assert 'versionCode 1' in s
          s=s.replace('versionCode 1','versionCode 1',1)
          p.write_text(s)
          print('NEW SIDE-BY-SIDE PACKAGE: app.nexusphalanx.stage.v24plaque')
          print('Existing V2/V2.1 apps and storage are untouched')
          PY
      - name: Add scoped HOME plaque correction to generated Android web assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('www/phx-home-plaque-v24.css')
          dst=Path('android/app/src/main/assets/public')
          assert src.is_file() and dst.is_dir(),'Missing source or generated web assets'
          index=dst/'index.html'
          assert index.is_file(),'Missing generated HOME'
          content=index.read_text()
          assert content.count('</head>')==1,'Unexpected HTML structure'
          tag='<link rel="stylesheet" href="./phx-home-plaque-v24.css" data-phx-plaque-v24="true"/>'
          assert tag not in content
          index.write_text(content.replace('</head>',tag+'\\n</head>',1))
          import shutil
          shutil.copy2(src,dst/src.name)
          assert (dst/src.name).read_bytes()==src.read_bytes()
          print('PASS: scoped name-only plaque CSS added to generated V2.4 APK, original frozen source untouched')
          PY
      - name: Build independent debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Verify package, certificate and APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n1)"
          SIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -m1 "^package:" | tee /tmp/package.txt
          grep -q "name='app.nexusphalanx.stage.v24plaque'" /tmp/package.txt
          "$SIGNER" verify --print-certs "$APK" | tee /tmp/apk-signature.txt
          grep -qi "certificate SHA-256 digest" /tmp/apk-signature.txt
          test -s "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: phalanx-v24-plaque-fixed-apk
          path: android-stage/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
