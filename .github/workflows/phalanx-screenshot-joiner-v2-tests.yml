name: PHALANX screenshot joiner v2 regression
on:
  push:
    paths:
      - 'src/phalanx-screenshot-joiner-v2.js'
      - 'tests/phalanx-screenshot-joiner-v2.test.js'
      - '.github/workflows/phalanx-screenshot-joiner-v2-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/phalanx-screenshot-joiner-v2.test.js
